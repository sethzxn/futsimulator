<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carreira — Simulador de Vida</title>
<style>
  /* Identidade visual do Astral Haikyuu (navy + dourado, tema claro) */
  :root{
    --navy:#0E2240; --navy2:#16325C; --gold:#F2B705; --gold-ink:#9A7000; --gold-bg:#FFF6D6;
    --floor:#EEF1F6; --paper:#FFFFFF; --paper2:#F6F8FB;
    --ink:#0F1B2D; --mut:#4F5D75; --dim:#7A869B; --line:#DCE2EB; --line2:#C5CEDB;
    --blue:#1D5FD6; --blue-bg:#E9F0FD; --blue-line:#A9C2F2;
    --ok:#15803D; --ok-bg:#E6F5EC; --bad:#C2312F; --bad-bg:#FCEBEA; --warn-ink:#8A5A00; --warn-bg:#FFF4D6; --warn-line:#F0D27A;
    --r:10px; --title:'Archivo',system-ui,sans-serif; --script:'Kaushan Script',cursive;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:var(--title);background:var(--floor);color:var(--ink);-webkit-font-smoothing:antialiased}

  /* Cabeçalho navy com marca condensada, igual ao site */
  header{position:sticky;top:0;z-index:5;background:var(--navy);box-shadow:0 2px 0 var(--gold)}
  .wrap{max-width:1040px;margin:0 auto;padding:16px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:4px}
  .brand{font-family:var(--title);font-stretch:72%;font-weight:800;font-size:24px;color:#fff;letter-spacing:.5px;text-transform:uppercase}
  .brand span{color:var(--gold)}
  #hdr{color:#B9C6DA;font-size:13px;font-weight:600}
  .tabs{display:flex;gap:2px;overflow-x:auto;max-width:1040px;margin:0 auto;padding:0 16px;scrollbar-width:none}
  .tab{flex:0 0 auto;padding:12px 16px;background:none;border:0;border-bottom:3px solid transparent;color:#B9C6DA;cursor:pointer;font:600 14px var(--title);text-transform:uppercase;letter-spacing:.4px}
  .tab:hover{color:#fff}
  .tab.on{color:#fff;border-bottom-color:var(--gold)}

  main.wrap{padding-top:20px}

  /* Hero: bloco navy com faixa dourada, como o hero do site */
  .hero{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:12px;padding:28px clamp(20px,4vw,40px);margin:0 0 16px;display:flex;gap:22px;align-items:center}
  .hero::after{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--gold)}
  .hero h2{margin:0 0 6px;font-size:clamp(28px,4.5vw,44px);font-weight:800;line-height:.95;text-transform:uppercase;letter-spacing:-.3px}
  .hero .mut{color:#B9C6DA}
  .kicker{font-family:var(--script);font-size:20px;color:var(--gold);margin-bottom:2px}

  .mut{color:var(--mut)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

  /* Cards brancos, linha fina e cantos de 10px */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px}
  .card h3{margin:0 0 12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--mut)}

  .stat{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
  .stat .mut{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .stat b{display:block;font-size:24px;font-weight:800;margin-top:2px;color:var(--navy)}
  .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--gold)}

  .btns{display:flex;flex-wrap:wrap;gap:8px}
  button.b{font:600 14px var(--title);border:1px solid var(--line2);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:6px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
  button.b:hover{border-color:var(--blue);background:var(--blue-bg)}
  button.b:disabled{opacity:.45;cursor:not-allowed;background:var(--paper2)}
  button.b:disabled:hover{border-color:var(--line2);background:var(--paper2)}
  button.b small{display:block;color:var(--mut);font-weight:500;font-size:12px;margin-top:3px}
  button.primary{background:var(--navy);color:var(--gold);border-color:var(--navy)}
  button.primary:hover{background:var(--navy2);border-color:var(--navy2)}

  label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:14px 0 6px}
  input,select,textarea{width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line2);border-radius:6px;padding:10px 12px;font:500 15px var(--title)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
  textarea{min-height:150px;resize:vertical}

  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{padding:8px 12px;border-radius:6px;border:1px solid var(--line2);background:var(--paper);cursor:pointer;font-weight:600;font-size:14px}
  .opt:hover{border-color:var(--blue)}
  .opt.on{border:2px solid var(--blue);background:var(--blue-bg);padding:7px 11px}

  .steps{display:flex;gap:6px;margin-bottom:14px}
  .steps span{flex:1;height:4px;border-radius:99px;background:var(--line)}
  .steps span.on{background:var(--gold)}

  .avatar{width:112px;height:112px;flex:0 0 auto;border-radius:50%;overflow:hidden;background:var(--navy2);border:3px solid var(--gold)}
  .avatar svg,.avatar img{width:100%;height:100%;display:block;object-fit:cover}

  .ev{border:1px solid var(--warn-line);background:var(--warn-bg)}
  .ev h3{color:var(--warn-ink)}

  .row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .log p{margin:8px 0;padding-left:12px;border-left:3px solid var(--line2)}
  .story{white-space:pre-wrap;line-height:1.65;color:var(--ink)}

  button.b.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-bg);background:var(--gold-bg)}
  .ch{color:var(--blue)!important;margin-top:2px}
  .tbl{width:100%;border-collapse:collapse;font-size:14px}
  .tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
  .tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
  .tbl tr.me td{background:var(--gold-bg);font-weight:700}
  @media (max-width:560px){
    .hero{flex-direction:column;text-align:center}
    .hero h2{font-size:28px}
    .brand{font-size:20px}
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
</head>

/* =========================================================
   CRIAÇÃO DE PERSONAGEM

function olho(cx, cy, tipo, cor, pele){
  const rx = tipo===1 ? 12 : 9;
  const ry = tipo===1 ? 13 : 10;
  let s = `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#fff"/>`;
  s += `<ellipse cx="${cx}" cy="${cy+1}" rx="${rx-3}" ry="${ry-2}" fill="${cor}"/>`;
  s += `<ellipse cx="${cx}" cy="${cy+2}" rx="${(rx-3)/2}" ry="${(ry-2)/1.6}" fill="#0b0b0f"/>`;
  s += `<circle cx="${cx+3}" cy="${cy-3}" r="${(rx*0.22).toFixed(1)}" fill="#fff"/>`;
  if(tipo===0) s += `<path d="M${cx-rx} ${cy-2} Q${cx} ${cy-ry-4} ${cx+rx} ${cy-2}" stroke="#0b0b0f" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  if(tipo===1) s += `<path d="M${cx-rx-1} ${cy-4} Q${cx} ${cy-ry-3} ${cx+rx+1} ${cy-4}" stroke="#0b0b0f" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  if(tipo===2) s += `<path d="M${cx-rx} ${cy-6} L${cx+rx} ${cy-2}" stroke="#0b0b0f" stroke-width="3" stroke-linecap="round"/>`;
  if(tipo===3){
    s += `<path d="M${cx-rx-2} ${cy-ry+6} L${cx+rx+2} ${cy-ry+6} L${cx+rx+2} ${cy-ry-6} L${cx-rx-2} ${cy-ry-6}Z" fill="${pele}"/>`;
    s += `<path d="M${cx-rx-1} ${cy-ry+6} L${cx+rx+1} ${cy-ry+6}" stroke="#0b0b0f" stroke-width="2.5" stroke-linecap="round"/>`;
  }
  return s;
}

function coletar(){
  const pegar = id => document.getElementById(id);
  if(pegar("c_nome")) { C.nome = pegar("c_nome").value.trim(); C.sobrenome = pegar("c_sobrenome").value.trim(); C.pais = pegar("c_pais").value; C.cidade = pegar("c_cidade").value.trim(); C.timeCoracao = pegar("c_time").value.trim(); C.clubeBase = pegar("c_clube").value; }
  if(pegar("c_posicao")) { C.posicao = pegar("c_posicao").value; C.motivacao = pegar("c_motivacao").value.trim(); }
  if(pegar("c_historia")) C.historia = pegar("c_historia").value.trim();
}

function validarPasso(){
  if(C.passo===0){
    if(!C.nome || !C.sobrenome){ alert("Preencha nome e sobrenome."); return false; }
    if(!C.cidade){ alert("Informe a cidade onde nasceu."); return false; }
  }
  return true;
}

function setAp(k,v){ coletar(); C.aparencia[k]=v; render(); }
function setOrigem(k){ coletar(); C.origem=k; render(); }

function enviarFoto(input){
  const f = input.files?.[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const size = 200;
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const ctx = c.getContext("2d");
      const s = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
      coletar();
      C.foto = c.toDataURL("image/jpeg", 0.85);
      render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
}
function removerFoto(){ coletar(); C.foto=null; render(); }

function proximoPasso(){
  coletar();
  if(!validarPasso()) return;
  if(C.passo < PASSOS.length-1){ C.passo++; render(); return; }
  criarPersonagem();
}
function voltarPasso(){ coletar(); if(C.passo>0){ C.passo--; render(); } }

function criarPersonagem(){
  const origem = DADOS.origens[C.origem];
  const clubeEscolhido = DADOS.clubes.find(c=>c.id===C.clubeBase) || DADOS.clubes[0];
  const at = {}; ["finalizacao","passe","drible","defesa","velocidade","resistencia","visao"].forEach(k=>at[k]=r(28,48));
  P = {
    perfil: {
      nome: `${C.nome} ${C.sobrenome}`,
      pais: C.pais, cidade: C.cidade, timeCoracao: C.timeCoracao,
      posicao: C.posicao, motivacao: C.motivacao, origem: C.origem,
      aparencia: C.aparencia, foto: C.foto, historia: C.historia,
    },
    idade: IDADE_INI, semana: 1, ano: 2026, dia: 1, diaAbs: 0, diaAtividade: null,
    at,
    xp: Object.fromEntries(Object.keys(at).map(k=>[k,0])),
    ultimoTreino: null, ultimoResultado: null,
    corpo: { saude:90, forma:65 },
    mente: { felicidade:60, estresse:20, disciplina:r(30,70), reputacao:10 },
    rel: { ...origem.rel, treinador: 50 },
    estudo: 0,
    vida: { dinheiro: origem.dinheiro, veiculos:[], casa:null, aluguel: origem.aluguel },
    carreira: { clube: clubeEscolhido.nome, nivel: clubeEscolhido.nivel, salario: 800, titulos: 0 },
    stats: { jogos:0, gols:0, assist:0, notas:[] },
    flags: {}, cooldown: {}, resultados: {}, noticias: [], lesao: null, cartoes: 0, suspenso: false,
    eventoAtual: null, partida: null, jogoFeito: null, ultimoJogo: null,
    historico: [], tela: "inicio",
  };
  gerarTemporada();
  C = null;
  log(`${P.perfil.nome} começa na base do ${clubeEscolhido.nome} aos 14 anos.`, "evento");
  salvar(); render();
}

const SAVE = "carreira-v4";
const IDADE_INI = 14;
const IDADE_MAX = 45;
const r = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick = a => a[r(0,a.length-1)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

let P = null;
function salvar(){ try{ localStorage.setItem(SAVE, JSON.stringify(P)); }catch(e){ console.warn("não foi possível salvar", e); } }
function carregar(){ try{ const s=localStorage.getItem(SAVE); return s?JSON.parse(s):null; }catch{ return null; } }

function aplicar(e){
  if(!e) return;
  for(const k in e){
    const v = e[k];
    switch(k){
      case "forma": P.corpo.forma = clamp(P.corpo.forma+v,0,100); break;
      case "saude": P.corpo.saude = clamp(P.corpo.saude+v,0,100); break;
      case "felicidade": P.mente.felicidade = clamp(P.mente.felicidade+v,0,100); break;
      case "estresse": P.mente.estresse = clamp(P.mente.estresse+v,0,100); break;
      case "disciplina": P.mente.disciplina = clamp(P.mente.disciplina+v,0,100); break;
      case "reputacao": P.mente.reputacao = clamp(P.mente.reputacao+v,0,100); break;
      case "rel_familia": P.rel.familia = clamp(P.rel.familia+v,0,100); break;
      case "rel_amigos": P.rel.amigos = clamp(P.rel.amigos+v,0,100); break;
      case "dinheiro": P.vida.dinheiro += v; break;
      case "estudo": P.estudo += v; break;
    }
  }
}
function log(txt, tipo){ P.historico.push({t:txt, tipo:tipo||"", s:P.semana, a:P.ano}); if(P.historico.length>250) P.historico.shift(); }

function gerarFraseDoLance(acao, acerto){
  const quem = pick(PARTIDA_PARTES.ataque_sucesso);
  if(acerto){
    return `${quem} ${pick(PARTIDA_PARTES.ataque_verbo)} ${pick(PARTIDA_PARTES.ataque_final)}.`;
  }
  return `${quem} ${pick(PARTIDA_PARTES.defesa_verbo)}, ${pick(PARTIDA_PARTES.defesa_final)}.`;
}

function eventoVidaProcedural(){
  const s = pick(G.sujeito);
  const titulo = `${s[0].toUpperCase()+s.slice(1)} ${pick(G.pedido)}`;
  const texto = `${pick(G.abertura)}, ${s} ${pick(G.pedido)} ${pick(G.motivo)}. ${pick(G.consequencia)}`;
  const escolhas = shuffle(DECISOES_VIDA).slice(0,3);
  return {
    id:"proc_"+Math.random().toString(36).slice(2,8), peso:0, procedural:true,
    titulo, texto,
    opcoes: escolhas.map(d=>({t:d.t, efeito:d.efeito, log:`${d.t}: ${titulo.toLowerCase()}.`})),
  };
}

// Calcula eventos extras de partida conforme tática, atributos e situação.
function eventoExtraDePartida(pt){
  const cand = EVENTOS_PARTIDA_TIPO.filter(e=>{
    if(e.exigeAt){ const [k,v] = Object.entries(e.exigeAt)[0]; return (P.at[k]??0) >= v; }
    return true;
  });
  const pesos = cand.map(e=>{ try{ return Math.max(0, e.peso(pt,P)); }catch{ return 0; } });
  const total = pesos.reduce((a,b)=>a+b,0);
  if(total<=0 || Math.random() > 0.35) return null;
  let x = Math.random()*total;
  for(let i=0;i<cand.length;i++){ x-=pesos[i]; if(x<=0) return cand[i]; }
  return null;
}

/* ---------- Tempo, calendário e liga ---------- */
const CLUBES_LIGA = ["Valmont FC","Alvorada Atlético","Serrano Esporte Clube","Rio Azul FC","Porto Verde","Monte Alto FC","Cidade Nova EC","União Sul FC"];
const TEMPORADA_RODADAS = 14;
const DIA_JOGO = 6;
const CHANCE_EVENTO_DIA = 0.2;
const CHANCE_NOTICIA_DIA = 0.6;
const COOLDOWN_EVENTO = 90;

const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };

function gerarCalendario(times){
  const n = times.length;
  const fixo = times[0];
  let rot = times.slice(1);
  const ida = [];
  for(let i=0;i<n-1;i++){
    const ordem = [fixo, ...rot];
    const jogos = [];
    for(let j=0;j<n/2;j++){
      const a = ordem[j], b = ordem[n-1-j];
      jogos.push(i%2===0 ? [a,b] : [b,a]);
    }
    ida.push(jogos);
    rot = [rot[rot.length-1], ...rot.slice(0,-1)];
  }
  const volta = ida.map(rd => rd.map(([a,b]) => [b,a]));
  return [...ida, ...volta];
}

function gerarTemporada(){
  const nomeP = P.carreira.clube;
  const outros = CLUBES_LIGA.filter(n => n!==nomeP).slice(0,7);
  const times = [nomeP, ...outros];
  const temporada = (P.liga?.temporada || 0) + 1;
  P.liga = {
    temporada,
    tabela: times.map(n => ({nome:n, j:0, v:0, e:0, d:0, gp:0, gc:0, pts:0})),
    forca: Object.fromEntries(times.map(n => [n, r(42,68)])),
  };
  P.liga.forca[nomeP] = clamp(P.liga.forca[nomeP] ?? 52, 42, 68);
  P.calendario = gerarCalendario(times);
}

function forcaTime(n){ return P.liga?.forca?.[n] ?? 50; }

function jogoDoJogadorNaRodada(rodada){
  if(!P.calendario || rodada<1 || rodada>TEMPORADA_RODADAS) return null;
  const j = P.calendario[rodada-1] || [];
  return j.find(([a,b]) => a===P.carreira.clube || b===P.carreira.clube) || null;
}
function jogoDeHoje(){ return P.dia===DIA_JOGO ? jogoDoJogadorNaRodada(P.semana) : null; }
function jogoPendenteHoje(){ return !!jogoDeHoje() && P.jogoFeito !== chaveSemana(); }

function aplicarResultadoTabela(a, ga, b, gb){
  const T = P.liga.tabela;
  const ta = T.find(t=>t.nome===a), tb = T.find(t=>t.nome===b);
  if(!ta || !tb) return;
  ta.j++; tb.j++; ta.gp+=ga; ta.gc+=gb; tb.gp+=gb; tb.gc+=ga;
  if(ga>gb){ ta.v++; ta.pts+=3; tb.d++; }
  else if(ga<gb){ tb.v++; tb.pts+=3; ta.d++; }
  else { ta.e++; tb.e++; ta.pts++; tb.pts++; }
}
function poisson(l){ const L=Math.exp(-l); let k=0, p=1; do{ k++; p*=Math.random(); }while(p>L); return k-1; }
function simularPlacar(fa, fb){
  const lam = x => Math.max(0.3, 1.1 + (x-50)/40);
  return [poisson(lam(fa)), poisson(lam(fb))];
}
function simularOutrosJogos(rodada){
  (P.calendario[rodada-1]||[]).forEach(([a,b]) => {
    if(a===P.carreira.clube || b===P.carreira.clube) return;
    const [ga,gb] = simularPlacar(forcaTime(a), forcaTime(b));
    aplicarResultadoTabela(a, ga, b, gb);
  });
}

function escolherLancesDaPartida(titular){
  const pool = shuffle(LANCES_POOL.filter(l=>l.tipo!=="fim"));
  const quantidade = titular ? 5 : 3;
  const fim = LANCES_POOL.find(l=>l.id==="reta");
  return [...pool.slice(0,quantidade), fim];
}

function iniciarPartida(){
  const jogo = jogoDeHoje();
  if(!jogo || P.jogoFeito===chaveSemana()) return;
  const adv = jogo[0]===P.carreira.clube ? jogo[1] : jogo[0];
  const titular = Math.random() < clamp(0.45 + (P.rel.treinador-50)/200 + (P.corpo.forma-50)/300 + (P.mente.reputacao-10)/400, 0.15, 0.9);
  const pt = {
    rodada: P.semana, adv, mandante: jogo[0]===P.carreira.clube,
    fase:"pre", tatica:null, instrucao:null,
    clima: pick(CLIMAS), arbitragem: pick(ARBITRAGENS), titular,
    lancesDoJogo: escolherLancesDaPartida(titular),
    lance:0, palestraFeita:false, bonusAtq:0, bonusDef:0,
    gP:0, gA:0, gJ:0, asJ:0, cartoesJog:0, lesionouJog:false, log:[],
  };
  pt.intervalo = Math.floor(pt.lancesDoJogo.length/2);
  P.partida = pt;
  salvar(); render();
}
function escolherTatica(id){ P.partida.tatica = id; salvar(); render(); }
function escolherInstrucao(id){ P.partida.instrucao = id; salvar(); render(); }
function comecarJogo(){
  const pt = P.partida;
  if(!pt || !pt.tatica || !pt.instrucao) return;
  pt.fase = "jogo";
  salvar(); render();
}

function resolverPalestra(i){
  const pt = P.partida; const p = PALESTRAS[i];
  pt.bonusAtq += p.atq; pt.bonusDef += p.def; pt.palestraFeita = true;
  P.rel.treinador = clamp(P.rel.treinador + (p.treinador||0), 0, 100);
  if(p.felic) P.mente.felicidade = clamp(P.mente.felicidade + p.felic, 0, 100);
  if(p.estresse) P.mente.estresse = clamp(P.mente.estresse + p.estresse, 0, 100);
  pt.log.push({titulo:"Intervalo", escolha:p.nome, texto:`Você fez uma palestra: ${p.nome.toLowerCase()}.`, placar:[pt.gP,pt.gA]});
  pt.fase = "jogo";
  salvar(); render();
}

function resolverLance(i){
  const pt = P.partida;
  const lance = pt.lancesDoJogo[pt.lance];
  const op = lance.opcoes[i];
  const tat = TATICAS.find(t=>t.id===pt.tatica);
  const ins = INSTRUCOES.find(x=>x.id===pt.instrucao);
  const cli = pt.clima;
  const at = P.at[op.attr] ?? 50;
  const forma = (P.corpo.forma-50)*0.002;
  const estresse = -(P.mente.estresse-30)*0.0015;
  const ataque = lance.tipo==="ataque" || lance.tipo==="parada";
  const comEquipe = pt.titular ? 0 : -0.02;

  let p = op.base + (at-50)*0.006 + forma + estresse + comEquipe;
  if(ataque) p += tat.atq + ins.atq + pt.bonusAtq + cli.atq;
  if(lance.tipo==="defesa") p += tat.def + pt.bonusDef;
  if(op.acao==="passe") p += ins.pas + cli.pas;
  if(op.acao==="chute" || op.acao==="cabeca") p += cli.fin;
  if(op.acao==="segura") p = 0.95;
  p = clamp(p, 0.05, 0.92);
  const acerto = Math.random() < p;

  const forcaAdv = forcaTime(pt.adv);
  const pContra = clamp(0.16 + (forcaAdv-50)/200 + (tat.def<0?0.03:0) - tat.def*0.5 - pt.bonusDef, 0.05, 0.6);

  let texto = "", gol=false, golJ=false, asst=false, contra=false, cartao=false, lesao=false, extra=null;

  if(ataque){
    if(op.acao==="chute"){
      if(acerto){
        if(Math.random() < 0.55 + (at-50)/200){ gol=true; golJ=true; texto=pickTxt("chute_gol"); }
        else texto=pickTxt("chute_defendido");
      } else texto=pickTxt("chute_erro");
    } else if(op.acao==="cabeca"){
      if(acerto){
        if(Math.random() < 0.5){ gol=true; golJ=true; texto=pickTxt("cabeca_gol"); }
        else texto=pickTxt("cabeca_defendido");
      } else texto=pickTxt("cabeca_erro");
    } else if(op.acao==="passe"){
      if(acerto){
        if(Math.random()<0.42){ gol=true; asst=true; texto=pickTxt("passe_gol"); }
        else texto=pickTxt("passe_ok");
      } else texto=pickTxt("passe_erro");
    } else if(op.acao==="drible"){
      if(acerto){
        if(Math.random()<0.30){ gol=true; golJ=true; texto=pickTxt("drible_gol"); }
        else texto=pickTxt("drible_ok");
      } else texto=pickTxt("drible_erro");
    } else {
      texto=pickTxt("segura_ok");
    }
    if(!acerto && op.acao!=="segura") contra = Math.random()<pContra;
  } else if(lance.tipo==="defesa"){
    if(op.acao==="reclama"){
      if(acerto){ texto=pickTxt("reclama_ok"); cartao=true; } else texto=pickTxt("reclama_erro");
    } else if(acerto){
      texto = pickTxt(op.acao+"_ok");
    } else {
      texto = pickTxt(op.acao+"_erro");
      contra = Math.random() < pContra + 0.15;
      if(op.acao==="marca" || op.acao==="pressao"){ cartao = Math.random() < pt.arbitragem.cartao * (1 + (60-P.mente.disciplina)/100 + (P.mente.estresse-40)/150); }
    }
  } else {
    if(op.acao==="fim_ataque"){
      if(Math.random() < (acerto?0.32:0.12)){ gol=true; texto=pickTxt("fim_ataque_gol"); }
      else texto=pickTxt("fim_ataque_erro");
      contra = Math.random() < (acerto?0.15:0.30);
    } else {
      texto = pickTxt(acerto?"fim_defesa_ok":"fim_defesa_erro");
      contra = Math.random() < (acerto?0.06:0.20);
    }
  }

  // Risco de lesão em ações de contato.
  // Lesão: mais provável com forma baixa, estresse alto e ações de contato.
  const riscoLesao = 0.04 * (1 + clamp((55-P.corpo.forma)/60,0,1.5) + clamp((P.mente.estresse-50)/80,0,1));
  if(op.risco && !acerto && Math.random() < riscoLesao){ lesao = true; }
  // Eventos extras aleatórios dentro do jogo.
  const sorte = Math.random();
  if(!lesao && sorte < 0.10){ extra = "torcida"; }
  else if(!lesao && sorte < 0.16 && gol){ extra = "anulado"; }
  else if(!lesao && sorte < 0.20 && !gol){ extra = "chance_perdida"; }
  // Evento extra de partida: depende da tática, dos atributos e da forma/estresse.
  const evExtra = !lesao ? eventoExtraDePartida(pt) : null;
  if(evExtra){
    texto += " " + evExtra.texto;
    if(evExtra.efeito.atq) pt.bonusAtq += evExtra.efeito.atq;
    if(evExtra.efeito.def) pt.bonusDef += evExtra.efeito.def;
    if(evExtra.efeito.cartao) pt.cartoesJog++;
    if(evExtra.efeito.sofreChance && Math.random() < evExtra.efeito.sofreChance) contra = true;
    pt.bonusAtq = clamp(pt.bonusAtq, -0.15, 0.15);
    pt.bonusDef = clamp(pt.bonusDef, -0.15, 0.15);
  }
  // Comentário gerado: frase montada a partir de combinações, para cada lance ser diferente.
  if(Math.random() < 0.5) texto += " " + gerarFraseDoLance(op.acao, acerto);

  if(gol && extra==="anulado"){ gol=false; golJ=false; asst=false; texto = pickTxt("anulado"); }
  if(extra==="torcida") texto += " " + pickTxt("torcida");
  if(extra==="chance_perdida") texto += " " + pickTxt("chance_perdida");

  if(gol) pt.gP++;
  if(golJ) pt.gJ++;
  if(asst) pt.asJ++;
  if(contra){ pt.gA++; texto += " " + pickTxt("contra_gol"); }
  if(cartao){ texto += " " + pickTxt("cartao"); pt.cartoesJog++; }
  if(lesao){
    texto += " " + pickTxt("lesao");
    pt.lesionouJog = true;
  }
  pt.log.push({ titulo:lance.titulo, escolha:op.t, texto, placar:[pt.gP,pt.gA], marcou:gol, sofreu:contra });

  pt.lance++;
  if(pt.lesionouJog || pt.lance >= pt.lancesDoJogo.length){ finalizarPartida(); return; }
  if(pt.lance === pt.intervalo && !pt.palestraFeita){ pt.fase = "intervalo"; }
  salvar(); render();
}

function finalizarPartida(){
  const pt = P.partida;
  const res = pt.gP>pt.gA ? "V" : pt.gP<pt.gA ? "D" : "E";
  aplicarResultadoTabela(P.carreira.clube, pt.gP, pt.adv, pt.gA);
  simularOutrosJogos(pt.rodada);

  const nota = clamp(6 + pt.gJ*1.2 + pt.asJ*0.8 - pt.gA*0.3 + (P.corpo.forma-50)/60 + (Math.random()-0.5) - pt.cartoesJog*0.4, 3, 10);
  P.stats.jogos++; P.stats.gols += pt.gJ; P.stats.assist += pt.asJ; P.stats.notas.push(Number(nota.toFixed(1)));
  P.stats.cartoes = (P.stats.cartoes||0) + pt.cartoesJog;
  if(res==="V"){ P.vida.dinheiro += 400; P.mente.reputacao = clamp(P.mente.reputacao+1,0,100); P.mente.felicidade = clamp(P.mente.felicidade+6,0,100); }
  else if(res==="E"){ P.vida.dinheiro += 150; }
  else { P.mente.reputacao = clamp(P.mente.reputacao-1,0,100); P.mente.felicidade = clamp(P.mente.felicidade-4,0,100); }
  P.corpo.forma = clamp(P.corpo.forma-6,0,100);
  P.mente.estresse = clamp(P.mente.estresse + (res==="V"?-2:5),0,100);

  P.cartoes = (P.cartoes||0) + pt.cartoesJog;
  if(P.cartoes >= 2){ P.suspenso = true; P.cartoes = 0; log("Você recebeu dois amarelos e fica suspenso no próximo jogo.", "jogo"); }

  if(pt.lesionouJog){
    const dias = r(7,28);
    P.lesao = { dias, tipo: pick(["músculo da coxa","tornozelo","joelho","panturrilha"]) };
    P.corpo.saude = clamp(P.corpo.saude-10,0,100);
    log(`Lesão: ${P.lesao.tipo}. Previsão de ${dias} dias fora.`, "lesao");
  }

  P.resultados = P.resultados || {};
  P.resultados[pt.rodada] = `${pt.gP}x${pt.gA}`;
  P.ultimoJogo = { adv:pt.adv, placar:[pt.gP,pt.gA], res, nota:nota.toFixed(1), gj:pt.gJ, asj:pt.asJ, clima:pt.clima.nome, arbitragem:pt.arbitragem.nome, lesao: pt.lesionouJog, log: pt.log };
  log(`Partida vs ${pt.adv}: ${pt.gP}x${pt.gA}. Nota ${nota.toFixed(1)}.`, "jogo");
  P.jogoFeito = chaveSemana();
  P.partida = null;
  salvar(); render();
}

// Jogo sem o jogador (lesionado ou suspenso): o time joga e o resultado sai pela força dos times.
function jogarSemJogador(){
  const jogo = jogoDeHoje();
  if(!jogo || P.jogoFeito===chaveSemana()) return;
  const adv = jogo[0]===P.carreira.clube ? jogo[1] : jogo[0];
  const [gP,gA] = simularPlacar(forcaTime(P.carreira.clube), forcaTime(adv));
  aplicarResultadoTabela(P.carreira.clube, gP, adv, gA);
  simularOutrosJogos(P.semana);
  const motivo = P.lesao ? `lesionado (${P.lesao.dias} dias)` : "suspenso";
  if(P.suspenso) P.suspenso = false;
  P.resultados = P.resultados || {};
  P.resultados[P.semana] = `${gP}x${gA}`;
  P.ultimoJogo = { adv, placar:[gP,gA], res: gP>gA?"V":gP<gA?"D":"E", nota:"–", gj:0, asj:0, clima:"–", arbitragem:"–", lesao:false, log:[{titulo:"Fora de campo", escolha:"", texto:`Você ficou de fora (${motivo}) e acompanhou o jogo.`, placar:[gP,gA]}] };
  log(`Você ficou fora (${motivo}). O time jogou contra ${adv}: ${gP}x${gA}.`, "jogo");
  P.jogoFeito = chaveSemana();
  salvar(); render();
}

/* ---------- Eventos ---------- */
function sortearEvento(){
  // Metade das vezes, um evento montado pelo gerador (milhares de combinações).
  if(Math.random() < 0.5) return eventoVidaProcedural();
  P.cooldown = P.cooldown || {};
  const elegiveis = EVENTOS.filter(ev => {
    const ultimo = P.cooldown[ev.id];
    if(ultimo !== undefined && P.diaAbs - ultimo < COOLDOWN_EVENTO) return false;
    try { return ev.cond(P); } catch { return false; }
  });
  if(!elegiveis.length) return null;
  const total = elegiveis.reduce((s,e)=>s+e.peso,0);
  let x = Math.random()*total;
  for(const ev of elegiveis){ x-=ev.peso; if(x<=0) return ev; }
  return elegiveis[0];
}
function resolverEventoAtual(i){
  const ev = P.eventoAtual; if(!ev) return;
  const op = ev.opcoes[i];
  aplicar(op.efeito);
  if(op.sorte){ aplicar({dinheiro: Math.random()<op.sorte.p ? op.sorte.ganho : op.sorte.perda}); }
  if(op.fx) op.fx();
  if(op.flag) P.flags[op.flag] = true;
  if(op.chance && Math.random()<op.chance.p) P.flags[op.chance.flag] = true;
  log(op.log || op.t, "evento");
  P.eventoAtual = null;
  salvar(); render();
}

function geraNoticiaDoDia(){
  if(Math.random() > CHANCE_NOTICIA_DIA) return;

  P.noticias = P.noticias || [];
  P.noticias.unshift({ t:n.t, dia:P.diaAbs, semana:P.semana, ano:P.ano });

/* ---------- Compras ---------- */
function comprar(tipo, id){
  const lista = tipo==="veiculo" ? DADOS.veiculos : DADOS.casas;
  const item = lista.find(x=>x.id===id);
  if(P.vida.dinheiro < item.preco){ alert("Dinheiro insuficiente."); return; }
  if(tipo==="veiculo"){
    if(P.vida.veiculos.includes(id)) return;
    P.vida.dinheiro -= item.preco; P.vida.veiculos.push(id);
  } else {
    if(P.vida.casa===id) return;
    P.vida.dinheiro -= item.preco; P.vida.casa = id;
  }
  aplicar(item.bonus);
  log(`Comprou: ${item.nome}`, "compra");
  salvar(); render();
}

/* ---------- Atividades e semana ---------- */
function atividade(id){
  if(P.diaAtividade === P.diaAbs) return;
  const a = ATIVIDADES.find(x=>x.id===id);
  const e = {...a.efeito};
  if(e.rel_familia){ P.rel.familia = clamp(P.rel.familia+e.rel_familia,0,100); delete e.rel_familia; }
  if(e.rel_amigos){ P.rel.amigos = clamp(P.rel.amigos+e.rel_amigos,0,100); delete e.rel_amigos; }
  aplicar(e);
  if(id==="fisio" && P.lesao){ P.lesao.dias = Math.max(1, P.lesao.dias-2); }
  P.diaAtividade = P.diaAbs;
  log(`${a.nome}: ${a.desc}`, "atividade");
  salvar(); render();
}

function fecharSemana(){
  let custo = 0;
  for(const id of P.vida.veiculos) custo += DADOS.veiculos.find(v=>v.id===id).manut/4;
  if(!P.vida.casa) custo += P.vida.aluguel/4;
  P.vida.dinheiro -= Math.round(custo);
  P.vida.dinheiro += Math.round(P.carreira.salario/4);
  P.corpo.forma = clamp(P.corpo.forma + Math.round((70-P.corpo.forma)*0.18),0,100);
  P.mente.estresse = clamp(P.mente.estresse-1,0,100);
  if(P.corpo.saude < 60) P.mente.felicidade = clamp(P.mente.felicidade-1,0,100);
  declinioIdade();

  P.semana++;
  if(P.semana === TEMPORADA_RODADAS+1) fecharTemporada();
  if(P.semana > 52){ P.semana = 1; P.ano++; P.idade++; log(`Aniversário: agora você tem ${P.idade} anos.`, "idade"); }
  if(P.semana === 1) gerarTemporada();
}

function fecharTemporada(){
  const tab = [...P.liga.tabela].sort((a,b)=> b.pts-a.pts || (b.gp-b.gc)-(a.gp-a.gc));
  const pos = tab.findIndex(t=>t.nome===P.carreira.clube)+1;
  if(pos===1){ P.carreira.titulos++; P.vida.dinheiro += 2000; P.mente.reputacao = clamp(P.mente.reputacao+5,0,100); log(`Campeão da temporada ${P.liga.temporada}!`, "conquista"); }
  else log(`Terminou a temporada ${P.liga.temporada} em ${pos}º lugar.`, "evento");
  // renovação de contrato: a proposta depende do desempenho
  const ganhoBase = pos<=3 ? 0.3 : pos<=6 ? 0.15 : 0.05;
  P.eventoAtual = {
    id:"renovacao", titulo:"Renovação de contrato",
    texto:`O clube quer renovar seu contrato. Você terminou em ${pos}º lugar e o salário atual é R$ ${P.carreira.salario}/mês.`,
    opcoes:[
      {t:`Aceitar a proposta (+${Math.round(ganhoBase*100)}%)`, efeito:{}, fx:()=>{ P.carreira.salario = Math.round(P.carreira.salario*(1+ganhoBase)); }, log:"Você renovou o contrato."},
      {t:"Pedir um aumento maior", efeito:{estresse:+4}, sorte:{p:0.5,ganho:0,perda:0}, fx:()=>{ const sobe = Math.random()<0.5; P.carreira.salario = Math.round(P.carreira.salario*(sobe?1+ganhoBase*2:1)); }, log:"Você negociou com dureza."},
      {t:"Recusar e buscar outro clube", efeito:{reputacao:+2,felicidade:-3}, log:"Você recusou e vai procurar outro clube."},
    ]
  };
}

function avancarDia(){
  if(P.eventoAtual || jogoPendenteHoje() || P.partida) return;
  P.diaAbs++;
  P.dia++;
  if(P.lesao){
    P.lesao.dias--;
    if(P.lesao.dias<=0){ log(`Você se recuperou da lesão (${P.lesao.tipo}).`, "saude"); P.lesao=null; }
  }
  if(P.dia > 7){ P.dia = 1; fecharSemana(); }
  geraNoticiaDoDia();
  if(P.dia !== DIA_JOGO && !P.eventoAtual && Math.random() < CHANCE_EVENTO_DIA){
    const ev = sortearEvento();
    if(ev){ P.eventoAtual = ev; P.cooldown[ev.id] = P.diaAbs; }
  }
  salvar(); render();
}

/* ---------- Treino: uma sessão por semana, com duas decisões ---------- */
const NOME_ATRIBUTO = {
  finalizacao:"Finalização", passe:"Passe", drible:"Drible", defesa:"Defesa",
  velocidade:"Velocidade", resistencia:"Resistência", visao:"Visão de jogo",
};

// Decisão 1: no que treinar. Cada foco trabalha um ou dois atributos.
const FOCOS = [
  { id:"finalizacao", nome:"Finalização", desc:"Chutes e finalização", attrs:["finalizacao"] },
  { id:"passe", nome:"Passe", desc:"Passes curtos e longos", attrs:["passe"] },
  { id:"drible", nome:"Drible", desc:"Condução e controle", attrs:["drible"] },
  { id:"visao", nome:"Visão de jogo", desc:"Leitura e posicionamento", attrs:["visao"] },
  { id:"defesa", nome:"Marcação", desc:"Defesa e marcação", attrs:["defesa"] },
  { id:"fisico", nome:"Preparo físico", desc:"Velocidade ou resistência", attrs:["velocidade","resistencia"] },
  { id:"estudo", nome:"Estudo tático", desc:"Não mexe nos atributos, mas rende estudo e disciplina", attrs:[] },
];

// Decisão 2: como treinar. Mais intensidade rende mais, mas cansa e arrisca mais.
const METODOS = [
  { id:"leve", nome:"Leve", desc:"Pouco desgaste. Progresso mais lento e seguro.",
    forma:-2, estresse:+2, pGanho:0.65, pPerda:0.05, lesao:0.00, xpGanho:1 },
  { id:"moderado", nome:"Moderado", desc:"Equilíbrio entre esforço e resultado.",
    forma:-4, estresse:+4, pGanho:0.55, pPerda:0.12, lesao:0.01, xpGanho:1 },
  { id:"intenso", nome:"Intenso", desc:"Muito esforço. Pode render bastante ou desandar.",
    forma:-6, estresse:+6, pGanho:0.35, pPerda:0.22, lesao:0.03, xpGanho:2 },
];

// Progresso necessário para subir um ponto. Cresce com o nível, então a evolução fica lenta.
const XP_NECESSARIO = lvl => Math.max(8, Math.round(8 + (lvl-30)*0.4));

function chaveSemana(){ return `${P.ano}-${P.semana}`; }
function jaTreinouNestaSemana(){ return P.ultimoTreino === chaveSemana(); }

// Chances estimadas para o jogador ver antes de decidir (sem revelar o sorteio).
function chancesTreino(focoId, metodoId){
  const foco = FOCOS.find(f=>f.id===focoId);
  const met = METODOS.find(m=>m.id===metodoId);
  if(!foco || !met || foco.attrs.length===0) return null;
  const attr = foco.attrs[0];
  const lvl = P.at[attr];
  const fForma = clamp((P.corpo.forma-10)/50, 0.5, 1.3);
  const dif = clamp(1 - (lvl-40)/80, 0.2, 1);
  const disc = 0.8 + P.mente.disciplina/250;
  const pG = clamp(met.pGanho * fForma * dif * disc, 0.02, 0.9);
  const pP = clamp(met.pPerda * (1 + P.mente.estresse/200), 0, 0.9);
  return { ganho: Math.round(pG*100), perda: Math.round(pP*100), lesao: Math.round(met.lesao*100) };
}

function subirOuDescerNivel(attr){
  let lvl = P.at[attr];
  P.xp[attr] = P.xp[attr] || 0;
  // Sobe de nível quando acumula progresso suficiente.
  while(P.xp[attr] >= XP_NECESSARIO(lvl) && lvl < 99){
    P.xp[attr] -= XP_NECESSARIO(lvl);
    lvl++;
    log(`${NOME_ATRIBUTO[attr]} subiu para ${lvl}.`, "evolucao");
  }
  // Perder progresso reduz o acumulado. Só cai de nível depois de um déficit grande,
  // e volta com a metade do progresso do nível novo, para não devolver tudo de uma vez.
  while(P.xp[attr] < -Math.floor(XP_NECESSARIO(lvl)/2) && lvl > 10){
    lvl--;
    P.xp[attr] = Math.floor(XP_NECESSARIO(lvl)/2);
    log(`${NOME_ATRIBUTO[attr]} caiu para ${lvl}.`, "evolucao");
  }
  P.at[attr] = lvl;
}

function executarTreino(focoId, metodoId){
  const foco = FOCOS.find(f=>f.id===focoId);
  const met = METODOS.find(m=>m.id===metodoId);
  if(jaTreinouNestaSemana()) return;

  aplicar({forma:met.forma, estresse:met.estresse});
  let msg;

  if(foco.attrs.length === 0){
    aplicar({estudo:2});
    if(Math.random()<0.5) aplicar({disciplina:1});
    msg = "Você estudou o jogo com calma. Pontos de estudo aumentaram.";
  } else {
    const attr = pick(foco.attrs);
    const ch = chancesTreino(focoId, metodoId);
    const u = Math.random();
    if(u < ch.ganho/100){
      P.xp[attr] = (P.xp[attr]||0) + met.xpGanho;
      msg = `Bom treino: progresso em ${NOME_ATRIBUTO[attr]}.`;
    } else if(u > 1 - ch.perda/100){
      P.xp[attr] = (P.xp[attr]||0) - 1;
      msg = `Treino ruim: você perdeu progresso em ${NOME_ATRIBUTO[attr]}.`;
    } else {
      msg = `Treino sem avanço claro em ${NOME_ATRIBUTO[attr]}.`;
    }
    subirOuDescerNivel(attr);
  }

  if(Math.random() < met.lesao){
    aplicar({saude:-8, forma:-6});
    msg += " Você sentiu uma lesão leve.";
  }

  P.ultimoTreino = chaveSemana();
  P.ultimoResultado = { foco: foco.nome, metodo: met.nome, msg };
  log(`Treino (${foco.nome}, ${met.nome}): ${msg}`, "treino");
}

// Com a idade, velocidade e resistência podem cair um pouco.
function declinioIdade(){
  if(P.idade < 34 || Math.random() > 0.012) return;
  const attr = pick(["velocidade","resistencia"]);
  P.at[attr] = clamp(P.at[attr]-1, 10, 99);
  log(`Com a idade, ${NOME_ATRIBUTO[attr]} caiu para ${P.at[attr]}.`, "evolucao");
}

let TR = { foco:null, metodo:null };
function escolherFoco(id){ TR.foco = id; render(); }
function escolherMetodo(id){ TR.metodo = id; render(); }
function confirmarTreino(){
  if(!TR.foco || !TR.metodo || jaTreinouNestaSemana()) return;
  executarTreino(TR.foco, TR.metodo);
  TR = { foco:null, metodo:null };
  salvar(); render();
}

function telaTreino(){
  const feito = jaTreinouNestaSemana();
  const res = P.ultimoResultado;

  const focos = FOCOS.map(f=>`
    <button class="b ${TR.foco===f.id?"sel":""}" ${feito?"disabled":""} onclick="escolherFoco('${f.id}')">${f.nome}<small>${f.desc}</small></button>`).join("");

  const metodos = METODOS.map(m=>{
    const ch = TR.foco ? chancesTreino(TR.foco, m.id) : null;
    const info = ch ? `Progresso ~${ch.ganho}% · recuo ~${ch.perda}%${ch.lesao?` · lesão ~${ch.lesao}%`:""}` : (TR.foco ? "" : "");
    return `<button class="b ${TR.metodo===m.id?"sel":""}" ${feito?"disabled":""} onclick="escolherMetodo('${m.id}')">${m.nome}<small>${m.desc}</small>${info?`<small class="ch">${info}</small>`:""}</button>`;
  }).join("");

  const pronto = TR.foco && TR.metodo && !feito;
  const focoAtual = TR.foco ? FOCOS.find(f=>f.id===TR.foco) : null;

  const estado = feito
    ? `<p class="mut">Você já treinou nesta semana. Avance a semana para treinar de novo.</p>`
    : `<p class="mut">Escolha <b>o que</b> treinar e <b>como</b> treinar. Um treino por semana.</p>`;

  const resultado = res ? `
    <div class="card" style="margin-top:0">
      <h3>Último treino</h3>
      <p><b>${res.foco}</b> · ${res.metodo}</p>
      <p class="mut">${res.msg}</p>
    </div>` : "";

  return `
    <div class="card">
      <h3>1. O que treinar</h3>
      <div class="btns">${focos}</div>
    </div>
    <div class="card">
      <h3>2. Como treinar ${focoAtual?`· ${focoAtual.nome}`:""}</h3>
      <div class="btns">${metodos}</div>
      <div class="btns" style="margin-top:14px">
        <button class="b primary" ${pronto?"":"disabled"} onclick="confirmarTreino()">Confirmar treino</button>
      </div>
      <div style="margin-top:10px">${estado}</div>
    </div>
    ${resultado}
    <div class="card"><h3>Atividades</h3>
      <div class="btns">${ATIVIDADES.map(a=>`<button class="b" onclick="atividade('${a.id}')">${a.nome}<small>${a.desc}</small></button>`).join("")}</div>
    </div>
    <div class="card"><h3>Atributos e progresso</h3>
      <div class="grid">${Object.entries(P.at).map(([k,v])=>{
        const need = XP_NECESSARIO(v);
        const xp = clamp(P.xp?.[k]||0,0,need);
        return `<div class="stat"><span class="mut">${NOME_ATRIBUTO[k]}</span><b>${v}</b>
          <div class="bar"><i style="width:${Math.round(xp/need*100)}%"></i></div>
          <span class="mut" style="font-size:11px">${xp}/${need} para subir</span></div>`;
      }).join("")}</div>
    </div>`;
}

      <div class="story">${p.historia || "<span class='mut'>Você ainda não escreveu a história.</span>"}</div>
    </div>`;
}

/* ---------- Fim ---------- */
function aposentar(){
  const n = P.stats.notas;
  const media = n.length ? (n.reduce((a,b)=>a+b,0)/n.length).toFixed(2) : "–";
  const p = P.perfil;
  app().innerHTML = `
    <section class="hero">
      <div class="avatar">${avatarHTML(P)}</div>
      <div><h2>Aposentadoria</h2><p class="mut">${p.nome} encerra a carreira aos ${P.idade} anos.</p></div>
    </section>
    <div class="grid">
      ${statBox("Jogos", P.stats.jogos)}${statBox("Gols", P.stats.gols)}${statBox("Assistências", P.stats.assist)}${statBox("Nota média", media)}
    </div>
    <div class="card" style="margin-top:14px"><h3>Biografia</h3>
      <p class="mut">${p.nome} nasceu em ${p.cidade}, ${p.pais}, e defendeu o ${P.carreira.clube}. Veículos: ${P.vida.veiculos.length}. Moradia: ${P.vida.casa?"própria":"alugada"}. Reputação: ${P.mente.reputacao}.</p>
      ${p.historia?`<div class="story" style="margin-top:12px">${p.historia}</div>`:""}
    </div>
    <div class="btns"><button class="b primary" onclick="iniciarCriador()">Nova carreira</button></div>`;
  localStorage.removeItem(SAVE);
  P = null;
}
function aposentarAgora(){ if(confirm("Encerrar a carreira agora?")) aposentar(); }

/* ---------- Inicialização ---------- */
P = carregar();
if(P){
  P.xp = P.xp || Object.fromEntries(Object.keys(P.at).map(k=>[k,0]));
  P.rel = P.rel || {}; if(P.rel.treinador==null) P.rel.treinador = 50;
  P.noticias = P.noticias || []; P.lesao = P.lesao || null;
  P.cartoes = P.cartoes || 0; P.suspenso = !!P.suspenso;
  P.resultados = P.resultados || {};
}
render();
</script>
</body>
</html>
