<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carreira — Simulador de Vida</title>
<style>
  /* Identidade visual do Astral Haikyuu (navy + dourado, tema claro) */
  :root{
    --navy:#0E2240; --navy2:#16325C; --gold:#F2B705; --gold-ink:#9A7000; --gold-bg:#FFF6D6;
    --floor:#EEF1F6; --paper:#FFFFFF; --paper2:#F6F8FB;
    --ink:#0F1B2D; --mut:#4F5D75; --dim:#7A869B; --line:#DCE2EB; --line2:#C5CEDB;
    --blue:#1D5FD6; --blue-bg:#E9F0FD; --blue-line:#A9C2F2;
    --ok:#15803D; --ok-bg:#E6F5EC; --bad:#C2312F; --bad-bg:#FCEBEA; --warn-ink:#8A5A00; --warn-bg:#FFF4D6; --warn-line:#F0D27A;
    --r:10px; --title:'Archivo',system-ui,sans-serif; --script:'Kaushan Script',cursive;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:var(--title);background:var(--floor);color:var(--ink);-webkit-font-smoothing:antialiased}

  /* Cabeçalho navy com marca condensada, igual ao site */
  header{position:sticky;top:0;z-index:5;background:var(--navy);box-shadow:0 2px 0 var(--gold)}
  .wrap{max-width:1040px;margin:0 auto;padding:16px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:4px}
  .brand{font-family:var(--title);font-stretch:72%;font-weight:800;font-size:24px;color:#fff;letter-spacing:.5px;text-transform:uppercase}
  .brand span{color:var(--gold)}
  #hdr{color:#B9C6DA;font-size:13px;font-weight:600}
  .tabs{display:flex;gap:2px;overflow-x:auto;max-width:1040px;margin:0 auto;padding:0 16px;scrollbar-width:none}
  .tab{flex:0 0 auto;padding:12px 16px;background:none;border:0;border-bottom:3px solid transparent;color:#B9C6DA;cursor:pointer;font:600 14px var(--title);text-transform:uppercase;letter-spacing:.4px}
  .tab:hover{color:#fff}
  .tab.on{color:#fff;border-bottom-color:var(--gold)}

  main.wrap{padding-top:20px}

  /* Hero: bloco navy com faixa dourada, como o hero do site */
  .hero{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:12px;padding:28px clamp(20px,4vw,40px);margin:0 0 16px;display:flex;gap:22px;align-items:center}
  .hero::after{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--gold)}
  .hero h2{margin:0 0 6px;font-size:clamp(28px,4.5vw,44px);font-weight:800;line-height:.95;text-transform:uppercase;letter-spacing:-.3px}
  .hero .mut{color:#B9C6DA}
  .kicker{font-family:var(--script);font-size:20px;color:var(--gold);margin-bottom:2px}

  .mut{color:var(--mut)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

  /* Cards brancos, linha fina e cantos de 10px */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px}
  .card h3{margin:0 0 12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--mut)}

  .stat{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
  .stat .mut{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .stat b{display:block;font-size:24px;font-weight:800;margin-top:2px;color:var(--navy)}
  .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--gold)}

  .btns{display:flex;flex-wrap:wrap;gap:8px}
  button.b{font:600 14px var(--title);border:1px solid var(--line2);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:6px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
  button.b:hover{border-color:var(--blue);background:var(--blue-bg)}
  button.b:disabled{opacity:.45;cursor:not-allowed;background:var(--paper2)}
  button.b:disabled:hover{border-color:var(--line2);background:var(--paper2)}
  button.b small{display:block;color:var(--mut);font-weight:500;font-size:12px;margin-top:3px}
  button.primary{background:var(--navy);color:var(--gold);border-color:var(--navy)}
  button.primary:hover{background:var(--navy2);border-color:var(--navy2)}

  label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:14px 0 6px}
  input,select,textarea{width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line2);border-radius:6px;padding:10px 12px;font:500 15px var(--title)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
  textarea{min-height:150px;resize:vertical}

  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{padding:8px 12px;border-radius:6px;border:1px solid var(--line2);background:var(--paper);cursor:pointer;font-weight:600;font-size:14px}
  .opt:hover{border-color:var(--blue)}
  .opt.on{border:2px solid var(--blue);background:var(--blue-bg);padding:7px 11px}

  .steps{display:flex;gap:6px;margin-bottom:14px}
  .steps span{flex:1;height:4px;border-radius:99px;background:var(--line)}
  .steps span.on{background:var(--gold)}

  .avatar{width:112px;height:112px;flex:0 0 auto;border-radius:50%;overflow:hidden;background:var(--navy2);border:3px solid var(--gold)}
  .avatar svg,.avatar img{width:100%;height:100%;display:block;object-fit:cover}

  .ev{border:1px solid var(--warn-line);background:var(--warn-bg)}
  .ev h3{color:var(--warn-ink)}

  .row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .log p{margin:8px 0;padding-left:12px;border-left:3px solid var(--line2)}
  .story{white-space:pre-wrap;line-height:1.65;color:var(--ink)}

  @media (max-width:560px){
    .hero{flex-direction:column;text-align:center}
    .hero h2{font-size:28px}
    .brand{font-size:20px}
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
</head>
<body>
<header>
  <div class="wrap top">
    <div class="brand">Carreira<span>.</span></div>
    <div class="mut" id="hdr"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main class="wrap" id="app"></main>

<script>
/* =========================================================
   DADOS FICTÍCIOS. Nomes, clubes e marcas são inventados.
   ========================================================= */
const DADOS = {
  nomes: ["Lucas","Mateus","Gabriel","Rafael","Thiago","Bruno","Caio","Vinícius","Felipe","Diego","Enzo","Matheus"],
  sobrenomes: ["Almeida","Teixeira","Moreira","Rocha","Barros","Fonseca","Ribeiro","Carvalho","Dias","Nogueira"],
  paises: ["Brasil","Argentina","Portugal","Espanha","Itália","Inglaterra","Alemanha","França","Estados Unidos","Japão","Outro"],
  clubes: [
    { id:"valmont", nome:"Valmont FC", nivel:1, cor:"#ef4444" },
    { id:"alvorada", nome:"Alvorada Atlético", nivel:2, cor:"#3b82f6" },
    { id:"serrano", nome:"Serrano Esporte Clube", nivel:3, cor:"#eab308" },
  ],
  veiculos: [
    { id:"moto", nome:"Moto usada", preco:6000, manut:40, bonus:{felicidade:2} },
    { id:"hatch", nome:"Hatch popular", preco:35000, manut:120, bonus:{felicidade:4} },
    { id:"sedan", nome:"Sedã confortável", preco:90000, manut:220, bonus:{felicidade:6,reputacao:2} },
    { id:"suv", nome:"SUV de luxo", preco:260000, manut:500, bonus:{felicidade:8,reputacao:6} },
  ],
  casas: [
    { id:"apto", nome:"Apartamento simples", preco:120000, bonus:{felicidade:4,estresse:-4} },
    { id:"casa", nome:"Casa de bairro", preco:350000, bonus:{felicidade:8,estresse:-8} },
    { id:"mans", nome:"Mansão", preco:1800000, bonus:{felicidade:14,estresse:-12,reputacao:8} },
  ],
  origens: {
    humilde: { nome:"Família humilde", dinheiro:300, aluguel:900, rel:{familia:65,amigos:50}, desc:"Dinheiro curto, mas família unida." },
    media:   { nome:"Classe média", dinheiro:1200, aluguel:800, rel:{familia:55,amigos:55}, desc:"Estabilidade e algum apoio." },
    alta:    { nome:"Família de classe alta", dinheiro:5000, aluguel:1500, rel:{familia:45,amigos:40}, desc:"Recursos de sobra, mas muita pressão." },
  },
};

const TREINOS = [
  { id:"fisico", nome:"Treino físico", desc:"Resistência e velocidade", ganha:["resistencia","velocidade"], custo:{forma:-6,estresse:+5} },
  { id:"finalizacao", nome:"Treino de finalização", desc:"Chutes e posicionamento", ganha:["finalizacao"], custo:{forma:-4,estresse:+3} },
  { id:"passe", nome:"Treino de passe", desc:"Passe e visão de jogo", ganha:["passe","visao"], custo:{forma:-3,estresse:+3} },
  { id:"drible", nome:"Treino de drible", desc:"Controle e condução", ganha:["drible"], custo:{forma:-4,estresse:+4} },
  { id:"defesa", nome:"Treino defensivo", desc:"Marcação e posicionamento", ganha:["defesa"], custo:{forma:-4,estresse:+3} },
  { id:"academia", nome:"Academia", desc:"Musculação e preparo", ganha:["resistencia"], custo:{forma:-5,estresse:+4}, extra:{saude:+1} },
  { id:"estudo", nome:"Estudar", desc:"Disciplina e futuro fora do campo", ganha:[], custo:{forma:-1,estresse:+4}, extra:{disciplina:+2,estudo:+3} },
];

const ATIVIDADES = [
  { id:"descanso", nome:"Descansar", desc:"Recupera forma, reduz estresse", efeito:{forma:+8,estresse:-8} },
  { id:"familia", nome:"Tempo com a família", desc:"Melhora relação com a família", efeito:{felicidade:+4,estresse:-3,rel_familia:+4} },
  { id:"amigos", nome:"Sair com os amigos", desc:"Diversão e vínculo social", efeito:{felicidade:+6,forma:-3,rel_amigos:+4} },
  { id:"festa", nome:"Festa", desc:"Muita diversão, mas cansa", efeito:{felicidade:+10,forma:-8,estresse:-4,reputacao:+1} },
  { id:"lazer", nome:"Lazer tranquilo", desc:"Relaxar e jogar algo", efeito:{felicidade:+3,estresse:-5} },
];

const EVENTOS = [
  { id:"proposta", peso:3, cond:s=>s.semana>=10,
    titulo:"Proposta de outro clube",
    texto:"Um clube de divisão maior quer você. A proposta exige mudar de cidade.",
    opcoes:[
      { t:"Aceitar a proposta", efeito:{reputacao:+6,felicidade:-6,dinheiro:+3000,rel_familia:-3}, log:"Você se mudou e começou em um clube maior.", mudaClube:1 },
      { t:"Recusar e continuar", efeito:{felicidade:+3,disciplina:+1}, log:"Você ficou onde estava e manteve a rotina." },
    ]},
  { id:"festa_vizinho", peso:2, cond:s=>s.semana>=4,
    titulo:"Convite para uma festa",
    texto:"Uma festa na véspera do jogo decisivo. Um colega comenta que vai ter fotos.",
    opcoes:[
      { t:"Ir e curtir", efeito:{felicidade:+8,forma:-10,reputacao:+2}, log:"A noite foi boa, mas o corpo sentiu.", chance:{p:0.3,flag:"foto_viral"} },
      { t:"Recusar e treinar", efeito:{forma:+4,estresse:+2,disciplina:+1}, log:"Você ficou em casa e treinou." },
    ]},
  { id:"lesao", peso:1, cond:s=>s.corpo.forma<50,
    titulo:"Dor no joelho",
    texto:"Depois de treinos puxados, o joelho começa a incomodar.",
    opcoes:[
      { t:"Procurar um médico", efeito:{saude:+5,dinheiro:-800}, log:"O médico pediu repouso e acompanhamento." },
      { t:"Ignorar e continuar", efeito:{saude:-10,forma:-5}, log:"A dor piorou um pouco.", flag:"lesao_risco" },
    ]},
  { id:"familia_briga", peso:2, cond:s=>s.idade>=15,
    titulo:"Briga em casa",
    texto:"Seu pai ou sua mãe quer que você largue o futebol e estude. A discussão esquentou.",
    opcoes:[
      { t:"Ceder e estudar", efeito:{disciplina:+3,rel_familia:+3,felicidade:-4}, log:"Você aceitou e passou a estudar mais." },
      { t:"Insistir no futebol", efeito:{felicidade:+2,rel_familia:-6,estresse:+5}, log:"A família ficou chateada, mas você seguiu." },
    ]},
  { id:"bonus", peso:2, cond:s=>s.stats.gols>=2,
    titulo:"Prêmio de gol",
    texto:"Um patrocinador quer dar um prêmio por seus gols recentes.",
    opcoes:[
      { t:"Aceitar o dinheiro", efeito:{dinheiro:+2500,reputacao:+2}, log:"Você recebeu o prêmio." },
      { t:"Pedir um contrato de imagem", efeito:{reputacao:+5,dinheiro:+500}, log:"Você fechou um contrato de imagem.", flag:"contrato_imagem" },
    ]},
  { id:"viral", peso:1, cond:s=>s.flags.foto_viral && !s.flags.viral_ok,
    titulo:"Foto viralizou",
    texto:"Uma foto sua da festa está circulando nas redes. Você precisa responder.",
    opcoes:[
      { t:"Pedir desculpas", efeito:{reputacao:-4,felicidade:-3}, log:"Você se desculpou e o assunto passou.", flag:"viral_ok" },
      { t:"Ignorar", efeito:{reputacao:-8,estresse:+8}, log:"O assunto cresceu nas redes.", flag:"viral_ok" },
    ]},
  { id:"amigo_pede", peso:2, cond:s=>s.semana>=8,
    titulo:"Amigo pede dinheiro",
    texto:"Um amigo de infância precisa de ajuda com uma dívida.",
    opcoes:[
      { t:"Emprestar", efeito:{dinheiro:-1500,rel_amigos:+6}, log:"Você emprestou, e o amigo agradeceu." },
      { t:"Recusar", efeito:{rel_amigos:-6,estresse:+2}, log:"Ele ficou chateado." },
    ]},
];

/* =========================================================
   CRIAÇÃO DE PERSONAGEM
   ========================================================= */
const SKINS = ["#f6d7b0","#e8b98a","#c98e5f","#a86a43","#7a4a2c","#4d2e1b"];
const HAIR_COLORS = ["#1a1410","#4a3320","#8a5a2b","#d9a85b","#b0b0b0","#c2410c"];
const SHIRTS = ["#22d3a0","#6366f1","#ef4444","#eab308","#3b82f6","#f8fafc"];
const HAIR_STYLES = [
  {id:"calvo", nome:"Raspado"},
  {id:"curto", nome:"Curto"},
  {id:"cacheado", nome:"Cacheado"},
  {id:"longo", nome:"Longo"},
  {id:"moicano", nome:"Moicano"},
];
const BARBAS = [{id:"nenhuma", nome:"Sem barba"},{id:"por_fazer", nome:"Por fazer"},{id:"barba", nome:"Barba"}];

function avatarSVG(ap){
  const skin = SKINS[ap.pele] ?? SKINS[1];
  const hair = HAIR_COLORS[ap.cabeloCor] ?? HAIR_COLORS[0];
  const shirt = SHIRTS[ap.camisa] ?? SHIRTS[0];
  const estilo = ap.cabelo || "curto";
  const barba = ap.barba || "nenhuma";

  const trasCabelo = estilo==="longo"
    ? `<path d="M46 86 Q40 28 100 28 Q160 28 154 86 L162 156 Q140 146 136 124 L64 124 Q60 146 38 156Z" fill="${hair}"/>` : "";
  const frenteCabelo = {
    calvo: `<ellipse cx="100" cy="58" rx="46" ry="14" fill="${hair}" opacity=".25"/>`,
    curto: `<path d="M52 82 Q50 34 100 32 Q150 34 148 82 Q140 54 100 54 Q60 54 52 82Z" fill="${hair}"/>`,
    cacheado: `<g fill="${hair}"><circle cx="60" cy="52" r="15"/><circle cx="80" cy="40" r="16"/><circle cx="100" cy="36" r="16"/><circle cx="120" cy="40" r="16"/><circle cx="140" cy="52" r="15"/><circle cx="54" cy="72" r="12"/><circle cx="146" cy="72" r="12"/></g>`,
    longo: `<path d="M52 82 Q50 36 100 34 Q150 36 148 82 Q140 56 100 56 Q60 56 52 82Z" fill="${hair}"/>`,
    moicano: `<path d="M90 56 L100 12 L110 56 Z" fill="${hair}"/><path d="M52 82 Q52 52 100 52 Q148 52 148 82 Q140 60 100 60 Q60 60 52 82Z" fill="${hair}"/>`,
  }[estilo] || "";

  const barbaSVG = {
    nenhuma: "",
    por_fazer: `<path d="M70 118 Q100 150 130 118 Q124 140 100 146 Q76 140 70 118Z" fill="${hair}" opacity=".3"/>`,
    barba: `<path d="M68 112 Q70 150 100 152 Q130 150 132 112 Q124 130 100 132 Q76 130 68 112Z" fill="${hair}"/>`,
  }[barba];

  return `
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="avatar">
    <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e2440"/><stop offset="1" stop-color="#0f3b33"/></linearGradient></defs>
    <rect width="200" height="200" fill="url(#bg)"/>
    ${trasCabelo}
    <path d="M30 200 Q40 160 100 160 Q160 160 170 200Z" fill="${shirt}"/>
    <rect x="88" y="136" width="24" height="30" fill="${skin}"/>
    <ellipse cx="100" cy="98" rx="46" ry="56" fill="${skin}"/>
    <ellipse cx="54" cy="100" rx="7" ry="11" fill="${skin}"/>
    <ellipse cx="146" cy="100" rx="7" ry="11" fill="${skin}"/>
    ${frenteCabelo}
    ${barbaSVG}
    <circle cx="82" cy="98" r="5" fill="#1b1b1b"/><circle cx="118" cy="98" r="5" fill="#1b1b1b"/>
    <circle cx="84" cy="96" r="1.6" fill="#fff"/><circle cx="120" cy="96" r="1.6" fill="#fff"/>
    <path d="M72 86 Q82 80 92 86" stroke="${hair}" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M108 86 Q118 80 128 86" stroke="${hair}" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M86 126 Q100 136 114 126" stroke="#6b2b2b" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>`;
}

function avatarHTML(p){
  if(p?.perfil?.foto) return `<img src="${p.perfil.foto}" alt="foto do personagem">`;
  return avatarSVG(p?.perfil?.aparencia || {});
}

let C = null; // estado do criador
const PASSOS = ["Identidade","Aparência","Origem","História"];

function iniciarCriador(){
  C = {
    passo:0,
    nome:"", sobrenome:"", pais:"Brasil", cidade:"", timeCoracao:"", clubeBase:"valmont",
    aparencia:{pele:1, cabelo:"curto", cabeloCor:1, barba:"nenhuma", camisa:0},
    foto:null,
    origem:"media", posicao:"Atacante", motivacao:"",
    /* posicao e motivacao têm valor inicial para não aparecer "undefined" na tela */
    historia:"",
  };
  render();
}

function passoIdentidade(){
  const clubes = DADOS.clubes.map(c=>`<option value="${c.id}" ${C.clubeBase===c.id?"selected":""}>${c.nome}</option>`).join("");
  return `
    <label>Nome</label><input id="c_nome" value="${C.nome}" placeholder="Ex.: Lucas">
    <label>Sobrenome</label><input id="c_sobrenome" value="${C.sobrenome}" placeholder="Ex.: Almeida">
    <label>País de nascimento</label>
    <select id="c_pais">${DADOS.paises.map(p=>`<option ${C.pais===p?"selected":""}>${p}</option>`).join("")}</select>
    <label>Cidade onde nasceu</label><input id="c_cidade" value="${C.cidade}" placeholder="Ex.: Natal">
    <label>Time do coração</label><input id="c_time" value="${C.timeCoracao}" placeholder="Qualquer time que você torce">
    <label>Clube da base (onde começa aos 14 anos)</label>
    <select id="c_clube">${clubes}</select>`;
}

function passoAparencia(){
  const pele = SKINS.map((c,i)=>`<div class="opt ${C.aparencia.pele===i?"on":""}" style="background:${c};width:34px;height:34px;padding:0" onclick="setAp('pele',${i})"></div>`).join("");
  const cabelo = HAIR_STYLES.map(h=>`<div class="opt ${C.aparencia.cabelo===h.id?"on":""}" onclick="setAp('cabelo','${h.id}')">${h.nome}</div>`).join("");
  const cor = HAIR_COLORS.map((c,i)=>`<div class="opt ${C.aparencia.cabeloCor===i?"on":""}" style="background:${c};width:34px;height:34px;padding:0" onclick="setAp('cabeloCor',${i})"></div>`).join("");
  const barba = BARBAS.map(b=>`<div class="opt ${C.aparencia.barba===b.id?"on":""}" onclick="setAp('barba','${b.id}')">${b.nome}</div>`).join("");
  const camisa = SHIRTS.map((c,i)=>`<div class="opt ${C.aparencia.camisa===i?"on":""}" style="background:${c};width:34px;height:34px;padding:0" onclick="setAp('camisa',${i})"></div>`).join("");
  return `
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      <div class="avatar" id="previewAvatar">${C.foto?`<img src="${C.foto}" alt="">`:avatarSVG(C.aparencia)}</div>
      <div class="mut" style="flex:1;min-width:200px">Monte o avatar ou envie uma foto. Se enviar foto, ela substitui o avatar.</div>
    </div>
    <label>Pele</label><div class="opts">${pele}</div>
    <label>Cabelo</label><div class="opts">${cabelo}</div>
    <label>Cor do cabelo</label><div class="opts">${cor}</div>
    <label>Barba</label><div class="opts">${barba}</div>
    <label>Cor da camisa</label><div class="opts">${camisa}</div>
    <label>Foto (opcional)</label>
    <input type="file" accept="image/*" onchange="enviarFoto(this)">
    ${C.foto?`<button class="b" style="margin-top:8px" onclick="removerFoto()">Remover foto</button>`:""}`;
}

function passoOrigem(){
  const origens = Object.entries(DADOS.origens).map(([k,o])=>`
    <div class="opt ${C.origem===k?"on":""}" style="display:block;margin-bottom:8px" onclick="setOrigem('${k}')">
      <b>${o.nome}</b><div class="mut" style="font-size:.85rem">${o.desc}</div>
    </div>`).join("");
  return `
    <label>Origem da família</label>${origens}
    <label>Posição</label>
    <select id="c_posicao">${["Goleiro","Zagueiro","Lateral","Volante","Meia","Ponta","Atacante"].map(p=>`<option ${C.posicao===p?"selected":""}>${p}</option>`).join("")}</select>
    <label>O que te motiva a jogar?</label>
    <input id="c_motivacao" value="${C.motivacao}" placeholder="Ex.: sair da pobreza, provar para o pai">`;
}

function passoHistoria(){
  return `
    <p class="mut">Escreva a história do seu personagem: como ele começou a jogar, a família, os amigos, os sonhos. Isso aparece na biografia no final da carreira.</p>
    <textarea id="c_historia" placeholder="Ex.: Lucas cresceu jogando bola na rua de terra em Natal...">${C.historia}</textarea>`;
}

function coletar(){
  const pegar = id => document.getElementById(id);
  if(pegar("c_nome")) { C.nome = pegar("c_nome").value.trim(); C.sobrenome = pegar("c_sobrenome").value.trim(); C.pais = pegar("c_pais").value; C.cidade = pegar("c_cidade").value.trim(); C.timeCoracao = pegar("c_time").value.trim(); C.clubeBase = pegar("c_clube").value; }
  if(pegar("c_posicao")) { C.posicao = pegar("c_posicao").value; C.motivacao = pegar("c_motivacao").value.trim(); }
  if(pegar("c_historia")) C.historia = pegar("c_historia").value.trim();
}

function validarPasso(){
  if(C.passo===0){
    if(!C.nome || !C.sobrenome){ alert("Preencha nome e sobrenome."); return false; }
    if(!C.cidade){ alert("Informe a cidade onde nasceu."); return false; }
  }
  return true;
}

function setAp(k,v){ coletar(); C.aparencia[k]=v; render(); }
function setOrigem(k){ coletar(); C.origem=k; render(); }

function enviarFoto(input){
  const f = input.files?.[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const size = 200;
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const ctx = c.getContext("2d");
      const s = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
      coletar();
      C.foto = c.toDataURL("image/jpeg", 0.85);
      render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
}
function removerFoto(){ coletar(); C.foto=null; render(); }

function proximoPasso(){
  coletar();
  if(!validarPasso()) return;
  if(C.passo < PASSOS.length-1){ C.passo++; render(); return; }
  criarPersonagem();
}
function voltarPasso(){ coletar(); if(C.passo>0){ C.passo--; render(); } }

function criarPersonagem(){
  const origem = DADOS.origens[C.origem];
  const clube = DADOS.clubes.find(c=>c.id===C.clubeBase) || DADOS.clubes[0];
  const at = {}; ["finalizacao","passe","drible","defesa","velocidade","resistencia","visao"].forEach(k=>at[k]=r(28,48));
  P = {
    perfil: {
      nome: `${C.nome} ${C.sobrenome}`,
      pais: C.pais, cidade: C.cidade, timeCoracao: C.timeCoracao,
      posicao: C.posicao, motivacao: C.motivacao, origem: C.origem,
      aparencia: C.aparencia, foto: C.foto, historia: C.historia,
    },
    idade: IDADE_INI, semana:1, ano:2026,
    at,
    corpo: { saude:90, forma:65 },
    mente: { felicidade:60, estresse:20, disciplina:r(30,70), reputacao:10 },
    rel: { ...origem.rel },
    estudo: 0,
    vida: { dinheiro: origem.dinheiro, veiculos:[], casa:null, aluguel: origem.aluguel },
    carreira: { clube: clube.nome, nivel: clube.nivel, salario: 800, titulos:0 },
    stats: { jogos:0, gols:0, assist:0, notas:[] },
    flags: {},
    historico: [],
    tela: "inicio",
  };
  C = null;
  log(`${P.perfil.nome} começa na base do ${clube.nome} aos 14 anos.`, "evento");
  salvar(); render();
}

/* =========================================================
   ESTADO
   ========================================================= */
const SAVE = "carreira-v3";
const IDADE_INI = 14;
const IDADE_MAX = 45;
const r = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick = a => a[r(0,a.length-1)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

let P = null;
function salvar(){ try{ localStorage.setItem(SAVE, JSON.stringify(P)); }catch(e){ console.warn("não foi possível salvar", e); } }
function carregar(){ try{ const s=localStorage.getItem(SAVE); return s?JSON.parse(s):null; }catch{ return null; } }

function aplicar(e){
  if(!e) return;
  for(const k in e){
    const v = e[k];
    switch(k){
      case "forma": P.corpo.forma = clamp(P.corpo.forma+v,0,100); break;
      case "saude": P.corpo.saude = clamp(P.corpo.saude+v,0,100); break;
      case "felicidade": P.mente.felicidade = clamp(P.mente.felicidade+v,0,100); break;
      case "estresse": P.mente.estresse = clamp(P.mente.estresse+v,0,100); break;
      case "disciplina": P.mente.disciplina = clamp(P.mente.disciplina+v,0,100); break;
      case "reputacao": P.mente.reputacao = clamp(P.mente.reputacao+v,0,100); break;
      case "rel_familia": P.rel.familia = clamp(P.rel.familia+v,0,100); break;
      case "rel_amigos": P.rel.amigos = clamp(P.rel.amigos+v,0,100); break;
      case "dinheiro": P.vida.dinheiro += v; break;
      case "estudo": P.estudo += v; break;
    }
  }
}
function log(txt, tipo){ P.historico.push({t:txt, tipo:tipo||"", s:P.semana, a:P.ano}); if(P.historico.length>250) P.historico.shift(); }

/* ---------- Partidas ---------- */
function partida(){
  const a = P.at;
  const pGol = clamp(10 + (a.finalizacao-50)*0.4 + P.corpo.forma*0.1 - P.mente.estresse*0.1, 3, 40)/100;
  const pAss = clamp(14 + (a.passe-50)*0.4 + P.corpo.forma*0.1 - P.mente.estresse*0.1, 5, 45)/100;
  const gol = Math.random()<pGol;
  const ass = !gol && Math.random()<pAss;
  const nota = clamp(5 + (gol?2:0) + (ass?1:0) + (Math.random()*2.4-1.2) + (P.corpo.forma-60)/60, 0, 10);
  P.stats.jogos++; if(gol) P.stats.gols++; if(ass) P.stats.assist++;
  P.stats.notas.push(Number(nota.toFixed(1)));
  P.vida.dinheiro += Math.round(P.carreira.salario*0.25);
  log(`Partida: nota ${nota.toFixed(1)}${gol?" · ⚽ gol":""}${ass?" · 🅰️ assistência":""}`, "jogo");
}

/* ---------- Escolhas ---------- */
function fazerTreino(id){
  const t = TREINOS.find(x=>x.id===id);
  const ganhoBase = 1 + (P.mente.disciplina>60?1:0);
  for(const k of t.ganha){ if(P.at[k]!==undefined) P.at[k] = clamp(P.at[k]+(Math.random()<0.6?ganhoBase:0),0,99); }
  aplicar(t.custo);
  if(t.extra?.saude) aplicar({saude:t.extra.saude});
  if(t.extra?.disciplina) aplicar({disciplina:t.extra.disciplina});
  if(t.extra?.estudo) aplicar({estudo:t.extra.estudo});
  log(`Treino: ${t.nome}`, "treino");
}
function fazerAtividade(id){
  const a = ATIVIDADES.find(x=>x.id===id);
  const e = {...a.efeito};
  if(e.rel_familia){ P.rel.familia = clamp(P.rel.familia+e.rel_familia,0,100); delete e.rel_familia; }
  if(e.rel_amigos){ P.rel.amigos = clamp(P.rel.amigos+e.rel_amigos,0,100); delete e.rel_amigos; }
  aplicar(e);
  log(`${a.nome}: ${a.desc}`, "atividade");
}

/* ---------- Eventos ---------- */
function sortearEvento(){
  const elegiveis = EVENTOS.filter(ev => { try{ return ev.cond(P); }catch{ return false; } });
  if(!elegiveis.length) return null;
  const total = elegiveis.reduce((s,e)=>s+e.peso,0);
  let x = Math.random()*total;
  for(const ev of elegiveis){ x-=ev.peso; if(x<=0) return ev; }
  return elegiveis[0];
}
function resolverEventoAtual(i){
  const ev = P.eventoAtual; if(!ev) return;
  const op = ev.opcoes[i];
  aplicar(op.efeito);
  if(op.mudaClube){
    const prox = DADOS.clubes.find(c=>c.nivel===P.carreira.nivel+1);
    if(prox){ P.carreira.clube = prox.nome; P.carreira.nivel = prox.nivel; P.carreira.salario = Math.round(P.carreira.salario*1.6); }
  }
  if(op.flag) P.flags[op.flag] = true;
  if(op.chance && Math.random()<op.chance.p) P.flags[op.chance.flag] = true;
  log(op.log || op.t, "evento");
  P.eventoAtual = null;
  salvar(); render();
}

/* ---------- Compras ---------- */
function comprar(tipo, id){
  const lista = tipo==="veiculo"?DADOS.veiculos:DADOS.casas;
  const item = lista.find(x=>x.id===id);
  if(P.vida.dinheiro < item.preco){ alert("Dinheiro insuficiente."); return; }
  if(tipo==="veiculo"){
    if(P.vida.veiculos.includes(id)) return;
    P.vida.dinheiro -= item.preco; P.vida.veiculos.push(id);
  } else {
    if(P.vida.casa===id) return;
    P.vida.dinheiro -= item.preco; P.vida.casa = id;
  }
  aplicar(item.bonus);
  log(`Comprou: ${item.nome}`, "compra");
  salvar(); render();
}

/* ---------- Semana ---------- */
function encerrarSemana(){
  let custo = 0;
  for(const id of P.vida.veiculos) custo += DADOS.veiculos.find(v=>v.id===id).manut/4;
  if(!P.vida.casa) custo += P.vida.aluguel/4;
  P.vida.dinheiro -= Math.round(custo);
  P.vida.dinheiro += Math.round(P.carreira.salario/4);
  P.corpo.forma = clamp(P.corpo.forma-1,0,100);
  P.mente.estresse = clamp(P.mente.estresse-1,0,100);
  if(P.corpo.saude < 60) P.mente.felicidade = clamp(P.mente.felicidade-1,0,100);
  P.semana++;
  if(P.semana > 52){ P.semana = 1; P.idade++; P.ano++; log(`Aniversário: agora você tem ${P.idade} anos.`, "idade"); }
}
function proximaSemana(){
  // partida da semana (60%)
  if(Math.random()<0.6) partida();
  encerrarSemana();
  P.eventoAtual = Math.random()<0.4 ? sortearEvento() : null;
  salvar(); render();
}

function treinar(id){ fazerTreino(id); salvar(); render(); }
function atividade(id){ fazerAtividade(id); salvar(); render(); }
function ir(t){ P.tela=t; salvar(); render(); }

/* =========================================================
   TELAS
   ========================================================= */
const TELAS = [
  {id:"inicio", nome:"Início"}, {id:"treino", nome:"Treino"}, {id:"vida", nome:"Vida"},
  {id:"compras", nome:"Compras"}, {id:"carreira", nome:"Carreira"}, {id:"historico", nome:"Histórico"},
  {id:"perfil", nome:"Perfil"},
];

function barra(v){ return `<div class="bar"><i style="width:${v}%"></i></div>`; }
function statBox(nome, v){ return `<div class="stat"><span class="mut">${nome}</span><b>${v}</b>${barra(typeof v==="number"?v:0)}</div>`; }
function app(){ return document.getElementById("app"); }

function renderHeader(){
  document.getElementById("hdr").textContent = P ? `${P.perfil.nome} · ${P.idade} anos · sem. ${P.semana}/${P.ano}` : "";
  document.getElementById("tabs").innerHTML = P ? TELAS.map(t=>`<button class="tab ${P.tela===t.id?"on":""}" onclick="ir('${t.id}')">${t.nome}</button>`).join("") : "";
}

function render(){
  renderHeader();
  if(C){ app().innerHTML = telaCriador(); return; }
  if(!P){
    app().innerHTML = `
      <section class="hero">
        <div class="avatar">${avatarSVG({pele:2,cabelo:"cacheado",cabeloCor:0,barba:"por_fazer",camisa:0})}</div>
        <div><h2>Sua vida, sua carreira</h2>
        <p class="mut">Crie seu personagem, escolha sua origem e escreva a história. Depois, cada semana é uma decisão.</p>
        <button class="b primary" onclick="iniciarCriador()">Criar personagem</button></div>
      </section>`;
    return;
  }
  if(P.idade >= IDADE_MAX){ return aposentar(); }
  const fn = {inicio:telaInicio, treino:telaTreino, vida:telaVida, compras:telaCompras, carreira:telaCarreira, historico:telaHistorico, perfil:telaPerfil}[P.tela] || telaInicio;
  app().innerHTML = fn();
}

function telaCriador(){
  return `
    <div class="card">
      <div class="steps">${PASSOS.map((p,i)=>`<span class="${i<=C.passo?"on":""}"></span>`).join("")}</div>
      <h3>${C.passo+1}. ${PASSOS[C.passo]}</h3>
      ${[passoIdentidade,passoAparencia,passoOrigem,passoHistoria][C.passo]()}
      <div class="btns" style="margin-top:16px">
        ${C.passo>0?`<button class="b" onclick="voltarPasso()">Voltar</button>`:""}
        <button class="b primary" onclick="proximoPasso()">${C.passo===PASSOS.length-1?"Criar personagem":"Próximo"}</button>
        ${C.passo===0?`<button class="b" onclick="C=null;render()">Cancelar</button>`:""}
      </div>
    </div>`;
}

function telaInicio(){
  const ev = P.eventoAtual ? `
    <div class="card ev">
      <h3>${P.eventoAtual.titulo}</h3>
      <p>${P.eventoAtual.texto}</p>
      <div class="btns">${P.eventoAtual.opcoes.map((o,i)=>`<button class="b" onclick="resolverEventoAtual(${i})">${o.t}</button>`).join("")}</div>
    </div>` : "";
  return `
    <section class="hero">
      <div class="avatar">${avatarHTML(P)}</div>
      <div>
        <h2>${P.perfil.nome}</h2>
        <p class="mut">${P.carreira.clube} · ${P.idade} anos · ${P.perfil.cidade}, ${P.perfil.pais}</p>
        <p class="mut">R$ ${P.vida.dinheiro.toLocaleString("pt-BR")}</p>
        <div class="btns" style="margin-top:12px">
          <button class="b primary" onclick="proximaSemana()">Avançar semana →</button>
          <button class="b" onclick="ir('treino')">Treinar</button>
        </div>
      </div>
    </section>
    ${ev}
    <div class="grid">
      ${statBox("Forma", P.corpo.forma)}${statBox("Saúde", P.corpo.saude)}
      ${statBox("Felicidade", P.mente.felicidade)}${statBox("Estresse", P.mente.estresse)}
    </div>`;
}

function telaTreino(){
  return `
    <div class="card"><h3>Treinos</h3>
      <div class="btns">${TREINOS.map(t=>`<button class="b" onclick="treinar('${t.id}')">${t.nome}<small>${t.desc}</small></button>`).join("")}</div>
    </div>
    <div class="card"><h3>Atividades</h3>
      <div class="btns">${ATIVIDADES.map(a=>`<button class="b" onclick="atividade('${a.id}')">${a.nome}<small>${a.desc}</small></button>`).join("")}</div>
    </div>
    <div class="card"><h3>Atributos</h3>
      <div class="grid">${Object.entries(P.at).map(([k,v])=>statBox(k,v)).join("")}</div>
    </div>`;
}

function telaVida(){
  return `
    <div class="card"><h3>Relações</h3>
      <div class="grid">${statBox("Família", P.rel.familia)}${statBox("Amigos", P.rel.amigos)}${statBox("Reputação", P.mente.reputacao)}${statBox("Disciplina", P.mente.disciplina)}</div>
    </div>
    <div class="card"><h3>Moradia</h3>
      <div class="row"><span>${P.vida.casa ? DADOS.casas.find(c=>c.id===P.vida.casa).nome : "Morando de aluguel"}</span><span class="mut">${P.vida.casa ? "" : "R$ "+P.vida.aluguel+"/mês"}</span></div>
    </div>
    <div class="card"><h3>Veículos</h3>
      ${P.vida.veiculos.length ? P.vida.veiculos.map(id=>{const v=DADOS.veiculos.find(x=>x.id===id); return `<div class="row"><span>${v.nome}</span><span class="mut">manutenção R$ ${v.manut}/mês</span></div>`;}).join("") : `<p class="mut">Nenhum veículo ainda.</p>`}
    </div>
    <div class="card"><h3>Estudo</h3><p class="mut">Pontos de estudo: <b>${P.estudo}</b></p></div>`;
}

function telaCompras(){
  return `
    <div class="card"><h3>Veículos</h3>
      <div class="btns">${DADOS.veiculos.map(v=>`<button class="b" ${P.vida.dinheiro<v.preco||P.vida.veiculos.includes(v.id)?"disabled":""} onclick="comprar('veiculo','${v.id}')">${v.nome}<small>R$ ${v.preco.toLocaleString("pt-BR")} · manutenção R$ ${v.manut}/mês</small></button>`).join("")}</div>
    </div>
    <div class="card"><h3>Moradia</h3>
      <div class="btns">${DADOS.casas.map(c=>`<button class="b" ${P.vida.dinheiro<c.preco||P.vida.casa===c.id?"disabled":""} onclick="comprar('casa','${c.id}')">${c.nome}<small>R$ ${c.preco.toLocaleString("pt-BR")}</small></button>`).join("")}</div>
    </div>`;
}

function telaCarreira(){
  const n = P.stats.notas;
  const media = n.length ? (n.reduce((a,b)=>a+b,0)/n.length).toFixed(2) : "–";
  return `
    <div class="grid">
      ${statBox("Jogos", P.stats.jogos)}${statBox("Gols", P.stats.gols)}${statBox("Assistências", P.stats.assist)}${statBox("Nota média", media)}
    </div>
    <div class="card" style="margin-top:14px"><h3>Clube</h3>
      <p class="mut">${P.carreira.clube} · salário base R$ ${P.carreira.salario}/mês</p>
      <div class="btns" style="margin-top:10px"><button class="b" onclick="aposentarAgora()">Aposentar agora</button></div>
    </div>`;
}

function telaHistorico(){
  const itens = [...P.historico].reverse().slice(0,80).map(h=>`<p>${h.s?`<span class="mut">S${h.s}/${h.a}</span> · `:""}${h.t}</p>`).join("");
  return `<div class="card log">${itens || "<p class='mut'>Nada ainda.</p>"}</div>`;
}

function telaPerfil(){
  const p = P.perfil;
  const origem = DADOS.origens[p.origem];
  return `
    <section class="hero">
      <div class="avatar">${avatarHTML(P)}</div>
      <div>
        <h2>${p.nome}</h2>
        <p class="mut">${p.posicao} · ${p.cidade}, ${p.pais}</p>
        <p class="mut">Time do coração: ${p.timeCoracao || "–"}</p>
      </div>
    </section>
    <div class="card"><h3>Origem</h3><p class="mut">${origem.nome}. ${origem.desc}</p>
      ${p.motivacao?`<p><b>Motivação:</b> ${p.motivacao}</p>`:""}
    </div>
    <div class="card"><h3>História</h3>
      <div class="story">${p.historia || "<span class='mut'>Você ainda não escreveu a história.</span>"}</div>
    </div>`;
}

/* ---------- Fim ---------- */
function aposentar(){
  const n = P.stats.notas;
  const media = n.length ? (n.reduce((a,b)=>a+b,0)/n.length).toFixed(2) : "–";
  const p = P.perfil;
  app().innerHTML = `
    <section class="hero">
      <div class="avatar">${avatarHTML(P)}</div>
      <div><h2>Aposentadoria</h2><p class="mut">${p.nome} encerra a carreira aos ${P.idade} anos.</p></div>
    </section>
    <div class="grid">
      ${statBox("Jogos", P.stats.jogos)}${statBox("Gols", P.stats.gols)}${statBox("Assistências", P.stats.assist)}${statBox("Nota média", media)}
    </div>
    <div class="card" style="margin-top:14px"><h3>Biografia</h3>
      <p class="mut">${p.nome} nasceu em ${p.cidade}, ${p.pais}, e defendeu o ${P.carreira.clube}. Veículos: ${P.vida.veiculos.length}. Moradia: ${P.vida.casa?"própria":"alugada"}. Reputação: ${P.mente.reputacao}.</p>
      ${p.historia?`<div class="story" style="margin-top:12px">${p.historia}</div>`:""}
    </div>
    <div class="btns"><button class="b primary" onclick="iniciarCriador()">Nova carreira</button></div>`;
  localStorage.removeItem(SAVE);
  P = null;
}
function aposentarAgora(){ if(confirm("Encerrar a carreira agora?")) aposentar(); }

/* ---------- Inicialização ---------- */
P = carregar();
render();
</script>
</body>
</html>
