<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carreira — Simulador de Vida</title>
<style>
  /* Identidade visual do Astral Haikyuu (navy + dourado, tema claro) */
  :root{
    --navy:#0E2240; --navy2:#16325C; --gold:#F2B705; --gold-ink:#9A7000; --gold-bg:#FFF6D6;
    --floor:#EEF1F6; --paper:#FFFFFF; --paper2:#F6F8FB;
    --ink:#0F1B2D; --mut:#4F5D75; --dim:#7A869B; --line:#DCE2EB; --line2:#C5CEDB;
    --blue:#1D5FD6; --blue-bg:#E9F0FD; --blue-line:#A9C2F2;
    --ok:#15803D; --ok-bg:#E6F5EC; --bad:#C2312F; --bad-bg:#FCEBEA; --warn-ink:#8A5A00; --warn-bg:#FFF4D6; --warn-line:#F0D27A;
    --r:10px; --title:'Archivo',system-ui,sans-serif; --script:'Kaushan Script',cursive;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:var(--title);background:var(--floor);color:var(--ink);-webkit-font-smoothing:antialiased}

  /* Cabeçalho navy com marca condensada, igual ao site */
  header{position:sticky;top:0;z-index:5;background:var(--navy);box-shadow:0 2px 0 var(--gold)}
  .wrap{max-width:1040px;margin:0 auto;padding:16px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:4px}
  .brand{font-family:var(--title);font-stretch:72%;font-weight:800;font-size:24px;color:#fff;letter-spacing:.5px;text-transform:uppercase}
  .brand span{color:var(--gold)}
  #hdr{color:#B9C6DA;font-size:13px;font-weight:600}
  .tabs{display:flex;gap:2px;overflow-x:auto;max-width:1040px;margin:0 auto;padding:0 16px;scrollbar-width:none}
  .tab{flex:0 0 auto;padding:12px 16px;background:none;border:0;border-bottom:3px solid transparent;color:#B9C6DA;cursor:pointer;font:600 14px var(--title);text-transform:uppercase;letter-spacing:.4px}
  .tab:hover{color:#fff}
  .tab.on{color:#fff;border-bottom-color:var(--gold)}

  main.wrap{padding-top:20px}

  /* Hero: bloco navy com faixa dourada, como o hero do site */
  .hero{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:12px;padding:28px clamp(20px,4vw,40px);margin:0 0 16px;display:flex;gap:22px;align-items:center}
  .hero::after{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--gold)}
  .hero h2{margin:0 0 6px;font-size:clamp(28px,4.5vw,44px);font-weight:800;line-height:.95;text-transform:uppercase;letter-spacing:-.3px}
  .hero .mut{color:#B9C6DA}
  .kicker{font-family:var(--script);font-size:20px;color:var(--gold);margin-bottom:2px}

  .mut{color:var(--mut)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

  /* Cards brancos, linha fina e cantos de 10px */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px}
  .card h3{margin:0 0 12px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--mut)}

  .stat{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
  .stat .mut{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  .stat b{display:block;font-size:24px;font-weight:800;margin-top:2px;color:var(--navy)}
  .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--gold)}

  .btns{display:flex;flex-wrap:wrap;gap:8px}
  button.b{font:600 14px var(--title);border:1px solid var(--line2);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:6px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
  button.b:hover{border-color:var(--blue);background:var(--blue-bg)}
  button.b:disabled{opacity:.45;cursor:not-allowed;background:var(--paper2)}
  button.b:disabled:hover{border-color:var(--line2);background:var(--paper2)}
  button.b small{display:block;color:var(--mut);font-weight:500;font-size:12px;margin-top:3px}
  button.primary{background:var(--navy);color:var(--gold);border-color:var(--navy)}
  button.primary:hover{background:var(--navy2);border-color:var(--navy2)}

  label{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:14px 0 6px}
  input,select,textarea{width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line2);border-radius:6px;padding:10px 12px;font:500 15px var(--title)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
  textarea{min-height:150px;resize:vertical}

  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{padding:8px 12px;border-radius:6px;border:1px solid var(--line2);background:var(--paper);cursor:pointer;font-weight:600;font-size:14px}
  .opt:hover{border-color:var(--blue)}
  .opt.on{border:2px solid var(--blue);background:var(--blue-bg);padding:7px 11px}

  .steps{display:flex;gap:6px;margin-bottom:14px}
  .steps span{flex:1;height:4px;border-radius:99px;background:var(--line)}
  .steps span.on{background:var(--gold)}

  .avatar{width:112px;height:112px;flex:0 0 auto;border-radius:50%;overflow:hidden;background:var(--navy2);border:3px solid var(--gold)}
  .avatar svg,.avatar img{width:100%;height:100%;display:block;object-fit:cover}

  .ev{border:1px solid var(--warn-line);background:var(--warn-bg)}
  .ev h3{color:var(--warn-ink)}

  .row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .log p{margin:8px 0;padding-left:12px;border-left:3px solid var(--line2)}
  .story{white-space:pre-wrap;line-height:1.65;color:var(--ink)}

  button.b.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-bg);background:var(--gold-bg)}
  .ch{color:var(--blue)!important;margin-top:2px}
  .tbl{width:100%;border-collapse:collapse;font-size:14px}
  .tbl th,.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left}
  .tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
  .tbl tr.me td{background:var(--gold-bg);font-weight:700}
  @media (max-width:560px){
    .hero{flex-direction:column;text-align:center}
    .hero h2{font-size:28px}
    .brand{font-size:20px}
  }

  /* ===== Visual The Fenômeno: fundo quase preto, dourado, cartão de jogador ===== */
  :root{
    --navy:#0a0a0a; --navy2:#1c1c1c; --gold:#F2B705; --gold-ink:#F2B705; --gold-bg:#2a2208;
    --floor:#060606; --paper:#121212; --paper2:#191919;
    --ink:#f4f4f5; --mut:#a1a1aa; --dim:#71717a; --line:#262626; --line2:#3a3a3a;
    --blue:#F2B705; --blue-bg:#241d05; --blue-line:#5a4a10;
    --ok:#22c55e; --ok-bg:#0f2a19; --bad:#ef4444; --bad-bg:#2a1111;
    --warn-ink:#F2B705; --warn-bg:#1d1806; --warn-line:#5a4a10; --gold-line:#F2B705;
  }
  body{background:radial-gradient(ellipse at top,#171200 0%,var(--floor) 45%)}
  header{background:#000;box-shadow:0 2px 0 var(--gold)}
  .brand{font-stretch:100%;font-weight:900;font-size:26px;letter-spacing:1px}
  .hero{background:linear-gradient(135deg,#1a1505 0%,#080808 70%);border:1px solid #2e2608}
  .hero h2{font-weight:900;font-size:clamp(26px,4.5vw,40px);letter-spacing:-.5px}
  .hero .mut{color:#c4c4cc}
  .kicker{font-family:var(--title);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
  .card{background:var(--paper);border-color:var(--line)}
  .stat b{color:var(--ink)}
  button.b{background:var(--paper2);color:var(--ink);border-color:var(--line2)}
  button.b:hover{border-color:var(--gold);background:#221c06}
  button.b:disabled{background:var(--paper)}
  button.b:disabled:hover{border-color:var(--line2);background:var(--paper)}
  button.b small{color:var(--mut)}
  button.primary{background:var(--gold);color:#0a0a0a;border-color:var(--gold)}
  button.primary:hover{background:#ffd23f;border-color:#ffd23f}
  input,select,textarea{background:var(--paper2);color:var(--ink);border-color:var(--line2)}
  .avatar{background:#1a1a1a}
  .ev{border-color:var(--gold);background:#1d1806}
  .row{border-color:var(--line)}
  .log p{border-left-color:var(--gold)}
  .tbl th,.tbl td{border-color:var(--line)}
  .tbl tr.me td{background:var(--gold-bg);color:var(--gold)}

  /* Manchete rolando no topo */
  .ticker{overflow:hidden;background:#000;border-top:1px solid var(--line);height:30px;display:flex;align-items:center;white-space:nowrap}
  .tk-track{display:inline-flex;gap:56px;padding-left:100%;animation:tk 60s linear infinite;color:#d4d4d8;font:700 12px var(--title);text-transform:uppercase;letter-spacing:.6px}
  .tk-track span::before{content:"● ";color:var(--gold)}
  @keyframes tk{to{transform:translateX(-100%)}}

  /* Cartão de jogador, estilo carta de videogame */
  .hero-fc{align-items:center;flex-wrap:wrap}
  .hero-txt{flex:1;min-width:200px}
  .fcard{width:190px;flex:0 0 auto;background:linear-gradient(165deg,#3a2f06 0%,#0d0b02 55%,#000 100%);border:2px solid var(--gold);border-radius:16px;padding:14px 12px 10px;text-align:center;box-shadow:0 14px 40px rgba(242,183,5,.18);color:#fff}
  .fc-top{display:flex;justify-content:space-between;align-items:flex-start;padding:0 4px}
  .fc-ovr{font-size:46px;font-weight:900;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
  .fc-pos{font-size:14px;font-weight:900;letter-spacing:1px;padding-top:6px}
  .fc-av{width:112px;height:112px;margin:8px auto 4px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);background:#1a1a1a}
  .fc-av svg{width:100%;height:100%;display:block}
  .fc-name{font-weight:900;text-transform:uppercase;font-size:14px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fc-tier{font-size:10px;letter-spacing:1.5px;color:var(--gold);font-weight:800;margin:4px 0 10px;text-transform:uppercase}
  .fc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-top:1px solid #3a3208;padding-top:8px}
  .fc-stats span{font-size:9px;color:var(--mut);letter-spacing:.6px;font-weight:700}
  .fc-stats b{display:block;font-size:17px;color:#fff;font-weight:900}

  /* Filtros em pílula e seções numeradas */
  .pills{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .pill{padding:7px 14px;border-radius:99px;border:1px solid var(--line2);background:var(--paper);color:var(--mut);font:800 12px var(--title);text-transform:uppercase;letter-spacing:.5px;cursor:pointer}
  .pill:hover{color:#fff;border-color:var(--gold)}
  .pill.on{background:var(--gold);color:#0a0a0a;border-color:var(--gold)}
  .sec-num{font:900 12px var(--title);letter-spacing:2px;color:var(--gold);text-transform:uppercase;margin:4px 0 10px}
  .rk-me td{background:var(--gold-bg);color:var(--gold);font-weight:800}
  .rk-tier{font-size:10px;letter-spacing:1px;color:var(--mut);text-transform:uppercase;font-weight:700}
  @media (max-width:560px){
    .hero-fc{flex-direction:column;text-align:center}
    .fcard{width:100%;max-width:260px}
    .tk-track{font-size:11px}
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="brand">Carreira<span>.</span></div>
    <div class="mut" id="hdr"></div>

  <div class="ticker" id="ticker"></div>
</header>
<main class="wrap" id="app"></main>

<script>
/* =========================================================
   DADOS FICTÍCIOS. Nomes, clubes e marcas são inventados.

const DADOS = {

  ],
  origens: {

};

const FRASES_ATIVIDADE = {
  descanso: ["Você dormiu cedo e acordou com outra energia.","Um dia sem compromisso, só descanso.","O corpo agradece: você ficou em casa e recuperou o fôlego."],
  familia: ["Almoço em família, sem falar de futebol.","Você passou a tarde com a família e ouviu conselhos antigos.","Uma conversa tranquila com seus pais mudou o clima da semana."],

const ATIVIDADES = [
  { id:"descanso", nome:"Descansar", desc:"Recupera forma, reduz estresse", efeito:{forma:+8,estresse:-8} },
  { id:"familia", nome:"Tempo com a família", desc:"Melhora relação com a família", efeito:{felicidade:+4,estresse:-3,rel_familia:+4} },
  { id:"amigos", nome:"Sair com os amigos", desc:"Diversão e vínculo social", efeito:{felicidade:+6,forma:-3,rel_amigos:+4} },
  { id:"festa", nome:"Festa", desc:"Muita diversão, mas cansa", efeito:{felicidade:+10,forma:-8,estresse:-4,reputacao:+1} },
  { id:"lazer", nome:"Lazer tranquilo", desc:"Relaxar e jogar algo", efeito:{felicidade:+3,estresse:-5} },
  { id:"fisio", nome:"Fisioterapia", desc:"Acelera a recuperação de lesões", efeito:{saude:+3,estresse:-2} },
];

const EVENTOS = [
  { id:"conversa_futuro", peso:2, cond:s=>s.par && s.par.status==="namoro",
    titulo:"Conversa sobre o futuro", texto:"Seu namoro chega a um ponto de decisão: morar junto ou manter cada um na sua casa?",
    opcoes:[
      {t:"Propor morar junto", efeito:{felicidade:+5,estresse:+3,dinheiro:-500}, fx:()=>{ P.par.afinidade=clamp(P.par.afinidade+8,0,100); }, log:"Você propôs morar junto."},
      {t:"Pedir mais tempo", efeito:{estresse:+1}, fx:()=>{ P.par.afinidade=clamp(P.par.afinidade-3,0,100); }, log:"Você pediu mais tempo."},
      {t:"Adiar a conversa", efeito:{estresse:+2,felicidade:-2}, log:"Você adiou a conversa."} ]},
  { id:"fa_viraliza", peso:2, cond:s=>s.par,
    titulo:"Vídeo que viralizou", texto:"Um vídeo de você com uma fã viralizou, e a sua pessoa ficou desconfiada.",
    opcoes:[
      {t:"Explicar tudo com calma", efeito:{reputacao:+1,estresse:+2}, fx:()=>{ P.par.afinidade=clamp(P.par.afinidade+2,0,100); }, log:"Você explicou a situação."},
      {t:"Fazer piada e seguir", efeito:{felicidade:+2,reputacao:-1}, fx:()=>{ P.par.afinidade=clamp(P.par.afinidade-4,0,100); }, log:"Você levou na brincadeira."} ]},
  { id:"patrocinio", peso:2, cond:s=>s.semana>=8,
    titulo:"Patrocínio local", texto:"Uma loja da cidade quer estampar seu nome na camisa de treino.",

  { id:"briga_familia", peso:2, cond:s=>s.idade>=15,

      {t:"Apostar", efeito:{felicidade:+4,dinheiro:+0}, log:"Você apostou. Sorte ou azar?", sorte:{p:0.5,ganho:800,perda:-800}},

  { id:"carro_quebrou", peso:2, cond:s=>s.vida.veiculos.length>0,

    opcoes:[
      {t:"Pagar o conserto", efeito:{dinheiro:-900,estresse:-2}, log:"O carro voltou a funcionar."},
      {t:"Vender peças usadas", efeito:{dinheiro:+300,estresse:+4}, log:"Você vendeu algumas peças e o carro ficou parado."} ]},
  { id:"convite_selecao", peso:1, cond:s=>s.idade>=15 && s.mente.reputacao>=20,
    titulo:"Seleção de base", texto:"A seleção de base convocou você para uma seleção de treinos.",
    opcoes:[
      {t:"Aceitar a convocação", efeito:{reputacao:+8,forma:-5,estresse:+5}, log:"Você foi aos treinos da seleção de base."},

  { id:"amigo_pede", peso:2, cond:s=>s.semana>=8,
    titulo:"Amigo pede dinheiro", texto:"Um amigo de infância precisa de ajuda com uma dívida.",

function olho(cx, cy, tipo, cor, pele){
  const rx = tipo===1 ? 12 : 9;
  const ry = tipo===1 ? 13 : 10;
  let s = `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#fff"/>`;
  s += `<ellipse cx="${cx}" cy="${cy+1}" rx="${rx-3}" ry="${ry-2}" fill="${cor}"/>`;
  s += `<ellipse cx="${cx}" cy="${cy+2}" rx="${(rx-3)/2}" ry="${(ry-2)/1.6}" fill="#0b0b0f"/>`;
  s += `<circle cx="${cx+3}" cy="${cy-3}" r="${(rx*0.22).toFixed(1)}" fill="#fff"/>`;
  if(tipo===0) s += `<path d="M${cx-rx} ${cy-2} Q${cx} ${cy-ry-4} ${cx+rx} ${cy-2}" stroke="#0b0b0f" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  if(tipo===1) s += `<path d="M${cx-rx-1} ${cy-4} Q${cx} ${cy-ry-3} ${cx+rx+1} ${cy-4}" stroke="#0b0b0f" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  if(tipo===2) s += `<path d="M${cx-rx} ${cy-6} L${cx+rx} ${cy-2}" stroke="#0b0b0f" stroke-width="3" stroke-linecap="round"/>`;
  if(tipo===3){
    s += `<path d="M${cx-rx-2} ${cy-ry+6} L${cx+rx+2} ${cy-ry+6} L${cx+rx+2} ${cy-ry-6} L${cx-rx-2} ${cy-ry-6}Z" fill="${pele}"/>`;
    s += `<path d="M${cx-rx-1} ${cy-ry+6} L${cx+rx+1} ${cy-ry+6}" stroke="#0b0b0f" stroke-width="2.5" stroke-linecap="round"/>`;
  }
  return s;
}

function avatarSVG(ap0){
  const a = {...APDEF, ...(ap0||{})};
  const pele = SKINS[a.pele] ?? SKINS[1];
  const cabelo = HAIR_COLORS[a.cabeloCor] ?? HAIR_COLORS[1];
  const cor = EYE_COLORS[a.corOlhos] ?? EYE_COLORS[0];
  const camisa = SHIRTS[a.camisa] ?? SHIRTS[0];
  const hs = HAIRS[a.cabelo] ?? HAIRS[1];
  const face = FACES[a.rosto] ?? FACES[0];

  const barba = barbaPath(a.barba, cabelo);
  const sardas = a.sardas ? [[78,118],[84,122],[90,118],[116,118],[122,122],[110,122]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.3" fill="#8a4b2d" opacity=".55"/>`).join("") : "";
  const bochecha = a.bochecha ? `<ellipse cx="74" cy="124" rx="8" ry="4" fill="#ff8fa3" opacity=".45"/><ellipse cx="126" cy="124" rx="8" ry="4" fill="#ff8fa3" opacity=".45"/>` : "";

  return `
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="avatar">
    <defs><radialGradient id="avbg" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#1c3a66"/><stop offset="1" stop-color="#0E2240"/></radialGradient></defs>
    <rect width="200" height="200" fill="url(#avbg)"/>

    <path d="M28 200 Q36 160 100 158 Q164 160 172 200Z" fill="${camisa}"/>
    <path d="M86 158 Q100 172 114 158" stroke="rgba(0,0,0,.25)" stroke-width="3" fill="none"/>
    <rect x="88" y="136" width="24" height="26" fill="${pele}"/>
    <rect x="88" y="136" width="24" height="8" fill="rgba(0,0,0,.12)"/>
    ${hs.back ? (typeof hs.back==="function" ? hs.back(cabelo) : hs.back) : ""}
    <ellipse cx="54" cy="106" rx="7" ry="12" fill="${pele}"/>
    <ellipse cx="146" cy="106" rx="7" ry="12" fill="${pele}"/>
    <path d="${face}" fill="${pele}"/>
    ${bochecha}${sardas}
    ${typeof hs.front==="function" ? hs.front(cabelo) : hs.front}
    ${barba}
    ${olho(84,102,a.olhos,cor,pele)}
    <g transform="translate(200 0) scale(-1 1)">${olho(84,102,a.olhos,cor,pele)}</g>
    ${sobrancelhaPath(a.sobrancelha)}
    <g transform="translate(200 0) scale(-1 1)">${sobrancelhaPath(a.sobrancelha)}</g>
    ${narizPath(a.nariz)}
    ${bocaPath(a.boca)}
  </svg>`;
}

function enviarFoto(input){
  const f = input.files?.[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const size = 200;
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const ctx = c.getContext("2d");
      const s = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
      coletar();
      C.foto = c.toDataURL("image/jpeg", 0.85);
      render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
}

function gerarFraseDoLance(acao, acerto){
  const ataque = ["chute","passe","drible","cabeca","segura"].includes(acao);
  const ctx = pick(FRASE_PARTES.contexto);
  let corpo;
  if(ataque && acerto){
    corpo = `${pick(FRASE_PARTES.ataque_sujeito)} ${pick(FRASE_PARTES.ataque_verbo)} ${pick(FRASE_PARTES.ataque_final)}`;
  } else if(ataque){
    corpo = `${pick(FRASE_PARTES.defesa_sujeito)} ${pick(FRASE_PARTES.defesa_verbo)}, ${pick(FRASE_PARTES.defesa_final)}`;
  } else if(acerto){
    corpo = `${pick(FRASE_PARTES.defesa_sujeito)} ${pick(FRASE_PARTES.defesa_verbo)}, ${pick(FRASE_PARTES.defesa_final)}`;
  } else {
    corpo = `${pick(FRASE_PARTES.adv_sujeito)} ${pick(FRASE_PARTES.adv_verbo)}, ${pick(FRASE_PARTES.adv_final)}`;
  }
  const frase = ctx ? `${ctx} ${corpo.charAt(0).toLowerCase()+corpo.slice(1)}` : corpo;
  return frase.charAt(0).toUpperCase() + frase.slice(1) + ".";
}

function eventoExtraDePartida(pt){
  const cand = EVENTOS_PARTIDA_TIPO.filter(e=>{
    if(e.exigeAt){ const [k,v] = Object.entries(e.exigeAt)[0]; return (P.at[k]??0) >= v; }
    return true;
  });
  const pesos = cand.map(e=>{ try{ return Math.max(0, e.peso(pt,P)); }catch{ return 0; } });
  const total = pesos.reduce((a,b)=>a+b,0);
  if(total<=0 || Math.random() > 0.35) return null;
  let x = Math.random()*total;
  for(let i=0;i<cand.length;i++){ x-=pesos[i]; if(x<=0) return cand[i]; }
  return null;
}

const CLUBES_LIGA = ["Valmont FC","Alvorada Atlético","Serrano Esporte Clube","Rio Azul FC","Porto Verde","Monte Alto FC","Cidade Nova EC","União Sul FC"];
const TEMPORADA_RODADAS = 14;

const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };

function gerarCalendario(times){
  const n = times.length;
  const fixo = times[0];
  let rot = times.slice(1);
  const ida = [];
  for(let i=0;i<n-1;i++){
    const ordem = [fixo, ...rot];
    const jogos = [];
    for(let j=0;j<n/2;j++){
      const a = ordem[j], b = ordem[n-1-j];
      jogos.push(i%2===0 ? [a,b] : [b,a]);
    }
    ida.push(jogos);
    rot = [rot[rot.length-1], ...rot.slice(0,-1)];
  }
  const volta = ida.map(rd => rd.map(([a,b]) => [b,a]));
  return [...ida, ...volta];
}

function gerarTemporada(){
  const nomeP = P.carreira.clube;
  const outros = CLUBES_LIGA.filter(n => n!==nomeP).slice(0,7);
  const times = [nomeP, ...outros];
  const temporada = (P.liga?.temporada || 0) + 1;
  P.liga = {
    temporada,
    tabela: times.map(n => ({nome:n, j:0, v:0, e:0, d:0, gp:0, gc:0, pts:0})),
    forca: Object.fromEntries(times.map(n => [n, r(42,68)])),
  };
  P.liga.forca[nomeP] = clamp(P.liga.forca[nomeP] ?? 52, 42, 68);
  P.calendario = gerarCalendario(times);
}

function forcaTime(n){ return P.liga?.forca?.[n] ?? 50; }

function jogoDoJogadorNaRodada(rodada){
  if(!P.calendario || rodada<1 || rodada>TEMPORADA_RODADAS) return null;
  const j = P.calendario[rodada-1] || [];
  return j.find(([a,b]) => a===P.carreira.clube || b===P.carreira.clube) || null;
}
function jogoDeHoje(){ return P.dia===DIA_JOGO ? jogoDoJogadorNaRodada(P.semana) : null; }
function jogoPendenteHoje(){ return !!jogoDeHoje() && P.jogoFeito !== chaveSemana(); }

function aplicarResultadoTabela(a, ga, b, gb){
  const T = P.liga.tabela;
  const ta = T.find(t=>t.nome===a), tb = T.find(t=>t.nome===b);
  if(!ta || !tb) return;
  ta.j++; tb.j++; ta.gp+=ga; ta.gc+=gb; tb.gp+=gb; tb.gc+=ga;
  if(ga>gb){ ta.v++; ta.pts+=3; tb.d++; }
  else if(ga<gb){ tb.v++; tb.pts+=3; ta.d++; }
  else { ta.e++; tb.e++; ta.pts++; tb.pts++; }
}
function poisson(l){ const L=Math.exp(-l); let k=0, p=1; do{ k++; p*=Math.random(); }while(p>L); return k-1; }
function simularPlacar(fa, fb){
  const lam = x => Math.max(0.3, 1.1 + (x-50)/40);
  return [poisson(lam(fa)), poisson(lam(fb))];
}
function simularOutrosJogos(rodada){
  (P.calendario[rodada-1]||[]).forEach(([a,b]) => {
    if(a===P.carreira.clube || b===P.carreira.clube) return;
    const [ga,gb] = simularPlacar(forcaTime(a), forcaTime(b));
    aplicarResultadoTabela(a, ga, b, gb);
  });
}

const NOT_SUJEITO = ["O atacante","O volante","O goleiro","O lateral","O técnico","A diretoria","O presidente do clube","A torcida organizada","O departamento médico","O zagueiro","O ponta","O meia","O preparador físico","O roupeiro","O capitão"];
const NOT_VERBO = ["acertou a renovação do contrato","falou pela primeira vez sobre a fase","foi elogiado pela imprensa","pediu mais tempo de treino","apareceu em uma entrevista de rádio","surpreendeu no treino de hoje","chamou atenção dos olheiros","comentou a derrota da semana","pediu desculpas por um lance","sentiu um desconforto no treino leve","começou a treinar com o grupo principal","foi cotado para a seleção sub-20","ganhou um prêmio de melhor do treino","recusou uma entrevista","ensinou um lance para a base"];
const NOT_CONTEXTO = ["depois da última vitória","em meio à pressão por resultados","antes do próximo confronto","no fim de uma semana corrida","sem muita explicação","para surpresa dos torcedores","durante a visita de um patrocinador","com a imprensa de olho em cada treino"];
const NOT_MODELOS = [
  () => `${pick(NOT_SUJEITO)} ${pick(NOT_VERBO)} ${pick(NOT_CONTEXTO)}.`,
  () => `Rumor: ${pick(CLUBES_LIGA)} estuda uma proposta por um jogador da base.`,
  () => `${P.perfil.nome.split(" ")[0]} aparece na lista de promessas da região.`,
  () => P.ultimoJogo ? `Após o jogo contra ${P.ultimoJogo.adv} (${P.ultimoJogo.placar[0]}x${P.ultimoJogo.placar[1]}), a imprensa comenta a atuação do time.` : `Comentaristas falam sobre a pré-temporada do ${P.carreira.clube}.`,
  () => `Pesquisa mostra que ${pick(["a torcida","os fãs mais jovens","os sócios do clube"])} ${pick(["prefere","cobra","apoia"])} ${pick(["mais ataque","mais calma","mais disciplina","mais jogadores da base"])}.`,
  () => `Empresário de ${pick(CLUBES_LIGA)} diz que acompanha ${P.perfil.nome.split(" ")[0]} de perto.`,
  () => `${pick(["Chuva","Calor","Vento"])} forte deve marcar os próximos jogos, segundo a previsão.`,
  () => `A cidade de ${P.perfil.cidade||"sua cidade"} organiza um dia de festa para a base do clube.`,
  () => `Um vídeo de treino do ${P.carreira.clube} circula nas redes e chama atenção.`,
  () => `${pick(["Um lateral","Um volante","Um atacante","Um goleiro"])} de ${pick(CLUBES_LIGA)} é anunciado como reforço da base.`,
  () => `Patrocinador ${pick(["de bebidas","de material esportivo","de transporte"])} escolhe ${P.carreira.clube} para ação na cidade.`,
];
function gerarNoticia(){
  const usadas = new Set((P.noticias||[]).slice(0,60).map(n=>n.t));
  for(let k=0;k<15;k++){
    const item = Math.random()<0.7 ? {t:pick(NOT_MODELOS)(), fx:{}} : pick(NOTICIAS);
    if(!usadas.has(item.t)) return item;
  }
  return null;
}
function geraNoticiaDoDia(){
  if(Math.random() > CHANCE_NOTICIA_DIA) return;
  const n = gerarNoticia(); if(!n) return;
  P.noticias = P.noticias || [];
  P.noticias.unshift({ t:n.t, dia:P.diaAbs, semana:P.semana, ano:P.ano });
  if(P.noticias.length>60) P.noticias.pop();
  aplicar(n.fx);
}

  {t:"Deixar para depois do treino", cond:s=>s.mente.disciplina>=50, efeito:{disciplina:+1}},
  {t:"Consultar um advogado", cond:s=>s.vida.dinheiro>2500, efeito:{dinheiro:-400,estresse:-2}},
];
function eventoVidaProcedural(){
  const s = pick(G.sujeito);
  const usaAssunto = Math.random() < 0.45;
  const titulo = usaAssunto ? pick(ASSUNTOS_VIDA) : `${s[0].toUpperCase()+s.slice(1)} ${pick(G.pedido)}`;
  const texto = usaAssunto
    ? `${pick(G.abertura)}. ${titulo}. ${pick(G.consequencia)}`
    : `${pick(G.abertura)}, ${s} ${pick(G.pedido)} ${pick(G.motivo)}. ${pick(G.consequencia)}`;
  const disponiveis = DECISOES_VIDA.filter(d=>{ try{ return !d.cond || d.cond(P); }catch{ return false; } });
  const escolhas = shuffle(disponiveis).slice(0,3);
  return {
    id:"proc_"+Math.random().toString(36).slice(2,8), peso:0, procedural:true, titulo, texto,
    opcoes: escolhas.map(d=>({t:d.t, efeito:d.efeito, fx:d.fx, log:`${d.t}: ${titulo.toLowerCase()}.`})),
  };
}

/* ---------- Propostas de clubes e entrevistas ---------- */
function gerarProposta(){
  const clube = pick(CLUBES_LIGA.filter(n=>n!==P.carreira.clube));
  const salario = Math.round(P.carreira.salario*1.4);
  const motivo = pick(["A cidade é longe da sua família.","Eles prometem mais chances de jogar como titular.","O clube tem uma comissão técnica experiente.","Há um projeto de base forte e observadores de seleção.","O diretor pediu para conversar pessoalmente."]);
  return {
    id:"proposta_"+P.ano+"_"+P.diaAbs, titulo:`Proposta do ${clube}`,
    texto:`O ${clube} quer contratar você. A oferta paga cerca de R$ ${salario}/mês, ${Math.round((salario/P.carreira.salario-1)*100)}% a mais que o atual. ${motivo}`,
    opcoes:[
      {t:`Aceitar e mudar para o ${clube}`, efeito:{reputacao:+3,felicidade:-2,rel_familia:-2}, fx:()=>{ P.carreira.clube=clube; P.carreira.salario=salario; const niv=DADOS.clubes.find(c=>c.nome===clube)?.nivel; if(niv) P.carreira.nivel=niv; }, log:`Você aceitou a proposta do ${clube}.`},
      {t:"Ficar no clube atual", efeito:{felicidade:+2,rel_amigos:+3}, log:"Você decidiu ficar onde está."},
      {t:"Negociar um salário maior", efeito:{estresse:+3}, fx:()=>{ if(Math.random()<0.5){ P.carreira.salario=Math.round(P.carreira.salario*1.2); log("O clube aceitou subir seu salário.","evento"); } else { P.mente.reputacao=clamp(P.mente.reputacao-1,0,100); log("O clube esfriou a negociação e a proposta perdeu força.","evento"); } }, log:"Você negociou com o clube atual."},
    ]
  };
}

function montarTexto(k){
  const d = TXT[k];
  let s = `${pick(d.ini)} ${pick(d.lugar)}`;
  const fim = pick(d.fim).trim();
  if(fim && Math.random()<0.6) s += `. ${fim}`;
  const cli = P.partida?.clima?.id;
  if(cli && CTX_TXT[cli] && Math.random()<0.2) s = pick(CTX_TXT[cli]) + s.charAt(0).toLowerCase() + s.slice(1);
  return s.charAt(0).toUpperCase() + s.slice(1) + (s.endsWith(".")||s.endsWith("!")||s.endsWith("?") ? "" : ".");
}
const pickTxt = k => TXT[k] ? montarTexto(k) : pick(TEXTOS[k] || ["..."]);



function pesoLance(l, pt){
  let w = 1;
  if(l.tipo==="ataque") w *= pt.tatica==="ofensiva" ? 1.8 : pt.tatica==="defensiva" ? 0.6 : 1;
  if(l.tipo==="defesa") w *= pt.tatica==="defensiva" ? 1.8 : pt.tatica==="ofensiva" ? 0.6 : 1;
  if(pt.instrucao==="gol" && l.tipo!=="defesa") w *= 1.2;
  if(pt.instrucao==="equipe" && l.opcoes.some(o=>o.acao==="passe")) w *= 1.25;
  if(pt.instrucao==="calma" && l.opcoes.some(o=>o.risco)) w *= 0.7;
  if(l.tags?.includes("chuva")) w *= pt.clima.id==="chuva" ? 4 : 0.2;
  const media = l.opcoes.reduce((s,o)=>s+(P.at[o.attr]??50),0)/l.opcoes.length;
  w *= 1 + Math.max(0, media-50)/40;
  if(P.corpo.forma<40 && l.opcoes.some(o=>o.risco)) w *= 0.7;
  return Math.max(0.05, w);
}
function escolherLancesDaPartida(titular, pt){
  const restantes = LANCES_POOL.filter(l=>l.tipo!=="fim");
  const quantidade = titular ? 7 : 4;
  const escolhidos = [];
  for(let k=0; k<quantidade && restantes.length; k++){
    const pesos = restantes.map(l=>pesoLance(l, pt));
    const total = pesos.reduce((a,b)=>a+b,0);
    let x = Math.random()*total, idx = 0;
    for(let i=0;i<restantes.length;i++){ x-=pesos[i]; if(x<=0){ idx=i; break; } }
    const l = restantes.splice(idx,1)[0];
    escolhidos.push({...l, texto: pick(l.textos || [l.texto])});
  }
  const fim = LANCES_POOL.find(l=>l.id==="reta");
  return [...escolhidos, {...fim, texto: pick(fim.textos || [fim.texto])}];
}

function iniciarPartida(){
  const jogo = jogoDeHoje();
  if(!jogo || P.jogoFeito===chaveSemana()) return;
  const adv = jogo[0]===P.carreira.clube ? jogo[1] : jogo[0];
  const titular = Math.random() < clamp(0.45 + (P.rel.treinador-50)/200 + (P.corpo.forma-50)/300 + (P.mente.reputacao-10)/400, 0.15, 0.9);
  const pt = {
    rodada: P.semana, adv, mandante: jogo[0]===P.carreira.clube,
    fase:"pre", tatica:null, instrucao:null,
    clima: pick(CLIMAS), arbitragem: pick(ARBITRAGENS), titular,
    lancesDoJogo: [],
    lance:0, palestraFeita:false, bonusAtq:0, bonusDef:0,
    gP:0, gA:0, gJ:0, asJ:0, cartoesJog:0, lesionouJog:false, log:[],
  };
  pt.intervalo = Math.floor(pt.lancesDoJogo.length/2);
  P.partida = pt;
  salvar(); render();
}
function escolherTatica(id){ P.partida.tatica = id; salvar(); render(); }
function escolherInstrucao(id){ P.partida.instrucao = id; salvar(); render(); }
function comecarJogo(){

  pt.lancesDoJogo = escolherLancesDaPartida(pt.titular, pt);

}

function resolverPalestra(i){
  const pt = P.partida; const p = PALESTRAS[i];
  pt.bonusAtq += p.atq; pt.bonusDef += p.def; pt.palestraFeita = true;
  P.rel.treinador = clamp(P.rel.treinador + (p.treinador||0), 0, 100);
  if(p.felic) P.mente.felicidade = clamp(P.mente.felicidade + p.felic, 0, 100);
  if(p.estresse) P.mente.estresse = clamp(P.mente.estresse + p.estresse, 0, 100);
  pt.log.push({titulo:"Intervalo", escolha:p.nome, texto:pick([`Você fez uma palestra: ${p.nome.toLowerCase()}.`,`No vestiário, você aposta em ${p.nome.toLowerCase()}. O grupo ouve em silêncio.`,`Palavras duras no intervalo: ${p.nome.toLowerCase()}.`]), placar:[pt.gP,pt.gA]});
  pt.fase = "jogo";
  salvar(); render();
}

function resolverLance(i){
  const pt = P.partida;
  const lance = pt.lancesDoJogo[pt.lance];
  const op = lance.opcoes[i];
  const tat = TATICAS.find(t=>t.id===pt.tatica);
  const ins = INSTRUCOES.find(x=>x.id===pt.instrucao);
  const cli = pt.clima;
  const at = P.at[op.attr] ?? 50;
  const forma = (P.corpo.forma-50)*0.002;
  const estresse = -(P.mente.estresse-30)*0.0015;
  const ataque = lance.tipo==="ataque" || lance.tipo==="parada";
  const comEquipe = pt.titular ? 0 : -0.02;

  let p = op.base + (at-50)*0.006 + forma + estresse + comEquipe;
  if(ataque) p += tat.atq + ins.atq + pt.bonusAtq + cli.atq + 0.10 + (P.nivel==='pro' ? -0.05 : 0.03);
  if(lance.tipo==="defesa") p += tat.def + pt.bonusDef;
  if(op.acao==="passe") p += ins.pas + cli.pas;
  if(op.acao==="chute" || op.acao==="cabeca") p += cli.fin;
  if(op.acao==="segura") p = 0.95;
  p = clamp(p, 0.05, 0.92);
  const acerto = Math.random() < p;

  const forcaAdv = forcaTime(pt.adv);
  const pContra = clamp(0.11 + (P.nivel==='pro' ? 0.04 : -0.03) + (forcaAdv-50)/200 + (tat.def<0?0.03:0) - tat.def*0.5 - pt.bonusDef, 0.05, 0.6);

  let texto = "", gol=false, golJ=false, asst=false, contra=false, cartao=false, lesao=false, extra=null;

  if(ataque){
    if(op.acao==="chute"){
      if(acerto){
        if(Math.random() < 0.66 + (at-50)/150){ gol=true; golJ=true; texto=pickTxt("chute_gol"); }
        else texto=pickTxt("chute_defendido");
      } else texto=pickTxt("chute_erro");
    } else if(op.acao==="cabeca"){
      if(acerto){
        if(Math.random() < 0.6){ gol=true; golJ=true; texto=pickTxt("cabeca_gol"); }
        else texto=pickTxt("cabeca_defendido");
      } else texto=pickTxt("cabeca_erro");
    } else if(op.acao==="passe"){
      if(acerto){
        if(Math.random()<0.5){ gol=true; asst=true; texto=pickTxt("passe_gol"); }
        else texto=pickTxt("passe_ok");
      } else texto=pickTxt("passe_erro");
    } else if(op.acao==="drible"){
      if(acerto){
        if(Math.random()<0.4){ gol=true; golJ=true; texto=pickTxt("drible_gol"); }
        else texto=pickTxt("drible_ok");
      } else texto=pickTxt("drible_erro");
    } else {
      texto=pickTxt("segura_ok");
    }
    if(!acerto && op.acao!=="segura") contra = Math.random()<pContra;
  } else if(lance.tipo==="defesa"){
    if(op.acao==="reclama"){
      if(acerto){ texto=pickTxt("reclama_ok"); cartao=true; } else texto=pickTxt("reclama_erro");
    } else if(acerto){
      texto = pickTxt(op.acao+"_ok");
    } else {
      texto = pickTxt(op.acao+"_erro");
      contra = Math.random() < pContra + 0.08;
      if(op.acao==="marca" || op.acao==="pressao"){ cartao = Math.random() < pt.arbitragem.cartao * (1 + (60-P.mente.disciplina)/100 + (P.mente.estresse-40)/150); }
    }
  } else {
    if(op.acao==="fim_ataque"){
      if(Math.random() < (acerto?0.45:0.2)){ gol=true; texto=pickTxt("fim_ataque_gol"); }
      else texto=pickTxt("fim_ataque_erro");
      contra = Math.random() < (acerto?0.15:0.30);
    } else {
      texto = pickTxt(acerto?"fim_defesa_ok":"fim_defesa_erro");
      contra = Math.random() < (acerto?0.06:0.20);
    }
  }

  // Risco de lesão em ações de contato.
  // Lesão: mais provável com forma baixa, estresse alto e ações de contato.
  const riscoLesao = 0.04 * (1 + clamp((55-P.corpo.forma)/60,0,1.5) + clamp((P.mente.estresse-50)/80,0,1));
  if(op.risco && !acerto && Math.random() < riscoLesao){ lesao = true; }
  // Eventos extras aleatórios dentro do jogo.
  const sorte = Math.random();
  if(!lesao && sorte < 0.10){ extra = "torcida"; }
  else if(!lesao && sorte < 0.16 && gol){ extra = "anulado"; }
  else if(!lesao && sorte < 0.20 && !gol){ extra = "chance_perdida"; }
  // Evento extra de partida: depende da tática, dos atributos e da forma/estresse.
  const evExtra = !lesao ? eventoExtraDePartida(pt) : null;
  if(evExtra){
    texto += " " + evExtra.texto;
    if(evExtra.efeito.atq) pt.bonusAtq += evExtra.efeito.atq;
    if(evExtra.efeito.def) pt.bonusDef += evExtra.efeito.def;
    if(evExtra.efeito.cartao) pt.cartoesJog++;
    if(evExtra.efeito.sofreChance && Math.random() < evExtra.efeito.sofreChance) contra = true;
    pt.bonusAtq = clamp(pt.bonusAtq, -0.15, 0.15);
    pt.bonusDef = clamp(pt.bonusDef, -0.15, 0.15);
  }
  // Comentário gerado: frase montada a partir de combinações, para cada lance ser diferente.
  if(Math.random() < 0.5) texto += " " + gerarFraseDoLance(op.acao, acerto);

  if(gol && extra==="anulado"){ gol=false; golJ=false; asst=false; texto = pickTxt("anulado"); }
  if(extra==="torcida") texto += " " + pickTxt("torcida");
  if(extra==="chance_perdida") texto += " " + pickTxt("chance_perdida");

  if(gol) pt.gP++;
  if(golJ) pt.gJ++;
  if(asst) pt.asJ++;
  if(contra){ pt.gA++; texto += " " + pickTxt("contra_gol"); }
  if(cartao){ texto += " " + pickTxt("cartao"); pt.cartoesJog++; }
  if(lesao){
    texto += " " + pickTxt("lesao");
    pt.lesionouJog = true;
  }
  pt.log.push({ titulo:lance.titulo, escolha:op.t, texto, placar:[pt.gP,pt.gA], marcou:gol, sofreu:contra });

  pt.lance++;
  if(pt.lesionouJog || pt.lance >= pt.lancesDoJogo.length){ finalizarPartida(); return; }
  if(pt.lance === pt.intervalo && !pt.palestraFeita){ pt.fase = "intervalo"; }
  salvar(); render();
}

function finalizarPartida(){
  const pt = P.partida;
  const res = pt.gP>pt.gA ? "V" : pt.gP<pt.gA ? "D" : "E";
  aplicarResultadoTabela(P.carreira.clube, pt.gP, pt.adv, pt.gA);
  simularOutrosJogos(pt.rodada);

  const nota = clamp(6 + pt.gJ*1.2 + pt.asJ*0.8 - pt.gA*0.3 + (P.corpo.forma-50)/60 + (Math.random()-0.5) - pt.cartoesJog*0.4, 3, 10);
  P.golsTemp = (P.golsTemp||0) + pt.gJ;
  P.stats.jogos++; P.stats.gols += pt.gJ; P.stats.assist += pt.asJ; P.stats.notas.push(Number(nota.toFixed(1)));
  P.stats.cartoes = (P.stats.cartoes||0) + pt.cartoesJog;
  if(res==="V"){ P.vida.dinheiro += 400; P.mente.reputacao = clamp(P.mente.reputacao+1,0,100); P.mente.felicidade = clamp(P.mente.felicidade+6,0,100); }
  else if(res==="E"){ P.vida.dinheiro += 150; }
  else { P.mente.reputacao = clamp(P.mente.reputacao-1,0,100); P.mente.felicidade = clamp(P.mente.felicidade-4,0,100); }
  P.corpo.forma = clamp(P.corpo.forma-6,0,100);
  P.mente.estresse = clamp(P.mente.estresse + (res==="V"?-2:5),0,100);

  P.cartoes = (P.cartoes||0) + pt.cartoesJog;
  if(P.cartoes >= 2){ P.suspenso = true; P.cartoes = 0; log("Você recebeu dois amarelos e fica suspenso no próximo jogo.", "jogo"); }

  if(pt.lesionouJog){
    const dias = r(7,28);
    P.lesao = { dias, tipo: pick(["músculo da coxa","tornozelo","joelho","panturrilha"]) };
    P.corpo.saude = clamp(P.corpo.saude-10,0,100);
    log(`Lesão: ${P.lesao.tipo}. Previsão de ${dias} dias fora.`, "lesao");
  }

  P.resultados = P.resultados || {};
  P.resultados[pt.rodada] = `${pt.gP}x${pt.gA}`;
  P.ultimoJogo = { adv:pt.adv, placar:[pt.gP,pt.gA], res, nota:nota.toFixed(1), gj:pt.gJ, asj:pt.asJ, clima:pt.clima.nome, arbitragem:pt.arbitragem.nome, lesao: pt.lesionouJog, log: pt.log };
  log(`Partida vs ${pt.adv}: ${pt.gP}x${pt.gA}. Nota ${nota.toFixed(1)}.`, "jogo");
  P.filaEventos = P.filaEventos || [];
  const entrevista = eventoEntrevista(res, nota.toFixed(1));
  if(P.eventoAtual) P.filaEventos.unshift(entrevista); else P.eventoAtual = entrevista;
  P.jogoFeito = chaveSemana();
  P.partida = null;
  salvar(); render();
}

// Jogo sem o jogador (lesionado ou suspenso): o time joga e o resultado sai pela força dos times.
function jogarSemJogador(){
  const jogo = jogoDeHoje();
  if(!jogo || P.jogoFeito===chaveSemana()) return;
  const adv = jogo[0]===P.carreira.clube ? jogo[1] : jogo[0];
  const [gP,gA] = simularPlacar(forcaTime(P.carreira.clube), forcaTime(adv));
  aplicarResultadoTabela(P.carreira.clube, gP, adv, gA);
  simularOutrosJogos(P.semana);
  const motivo = P.lesao ? `lesionado (${P.lesao.dias} dias)` : "suspenso";
  if(P.suspenso) P.suspenso = false;
  P.resultados = P.resultados || {};
  P.resultados[P.semana] = `${gP}x${gA}`;
  P.ultimoJogo = { adv, placar:[gP,gA], res: gP>gA?"V":gP<gA?"D":"E", nota:"–", gj:0, asj:0, clima:"–", arbitragem:"–", lesao:false, log:[{titulo:"Fora de campo", escolha:"", texto:`Você ficou de fora (${motivo}) e acompanhou o jogo.`, placar:[gP,gA]}] };
  log(`Você ficou fora (${motivo}). O time jogou contra ${adv}: ${gP}x${gA}.`, "jogo");
  P.jogoFeito = chaveSemana();
  salvar(); render();
}

/* ---------- Eventos ---------- */
function sortearEvento(){
  // Metade das vezes, um evento montado pelo gerador (milhares de combinações).
  if(Math.random() < 0.5) return eventoVidaProcedural();
  P.cooldown = P.cooldown || {};
  const elegiveis = EVENTOS.filter(ev => {
    const ultimo = P.cooldown[ev.id];
    if(ultimo !== undefined && P.diaAbs - ultimo < COOLDOWN_EVENTO) return false;
    try { return ev.cond(P); } catch { return false; }
  });
  if(!elegiveis.length) return null;
  const total = elegiveis.reduce((s,e)=>s+e.peso,0);
  let x = Math.random()*total;
  for(const ev of elegiveis){ x-=ev.peso; if(x<=0) return ev; }
  return elegiveis[0];
}
function resolverEventoAtual(i){
  const ev = P.eventoAtual; if(!ev) return;
  const op = ev.opcoes[i];
  aplicar(op.efeito);
  if(op.sorte){ aplicar({dinheiro: Math.random()<op.sorte.p ? op.sorte.ganho : op.sorte.perda}); }
  if(op.fx) op.fx();
  if(op.flag) P.flags[op.flag] = true;
  if(op.chance && Math.random()<op.chance.p) P.flags[op.chance.flag] = true;
  log(op.log || op.t, "evento");
  P.eventoAtual = null;
  salvar(); render();
}

/* ---------- Atividades e semana ---------- */
function atividade(id){
  if(P.diaAtividade === P.diaAbs) return;
  const a = ATIVIDADES.find(x=>x.id===id);
  const e = {...a.efeito};
  if(e.rel_familia){ P.rel.familia = clamp(P.rel.familia+e.rel_familia,0,100); delete e.rel_familia; }
  if(e.rel_amigos){ P.rel.amigos = clamp(P.rel.amigos+e.rel_amigos,0,100); delete e.rel_amigos; }
  aplicar(e);
  if(id==="fisio" && P.lesao){ P.lesao.dias = Math.max(1, P.lesao.dias-2); }
  P.diaAtividade = P.diaAbs;
  log(pick(FRASES_ATIVIDADE[id] || [`${a.nome}: ${a.desc}`]), "atividade");
  salvar(); render();
}

function fecharSemana(){
  let custo = 0;
  for(const id of P.vida.veiculos) custo += DADOS.veiculos.find(v=>v.id===id).manut/4;
  if(!P.vida.casa) custo += P.vida.aluguel/4;
  P.vida.dinheiro -= Math.round(custo);
  P.vida.dinheiro += Math.round(P.carreira.salario/4);
  P.corpo.forma = clamp(P.corpo.forma + Math.round((70-P.corpo.forma)*0.18),0,100);
  P.mente.estresse = clamp(P.mente.estresse-1,0,100);
  if(P.corpo.saude < 60) P.mente.felicidade = clamp(P.mente.felicidade-1,0,100);
  declinioIdade();

  cobrarDividas();
  rendimentoSemanal();
  semanaPessoal();
  P.semana++;
  if(P.semana === TEMPORADA_RODADAS+1) fecharTemporada();
  if(P.semana > 52){ P.semana = 1; P.ano++; P.idade++; log(`Aniversário: agora você tem ${P.idade} anos.`, "idade"); }
  if(P.semana === 1) gerarTemporada();
}

function fecharTemporada(){
  const tab = [...P.liga.tabela].sort((a,b)=> b.pts-a.pts || (b.gp-b.gc)-(a.gp-a.gc));
  const pos = tab.findIndex(t=>t.nome===P.carreira.clube)+1;
  if(pos===1){ P.carreira.titulos++; P.vida.dinheiro += 2000; P.mente.reputacao = clamp(P.mente.reputacao+5,0,100); log(`Campeão da temporada ${P.liga.temporada}!`, "conquista"); }
  else log(`Terminou a temporada ${P.liga.temporada} em ${pos}º lugar.`, "evento");
  if(pos===1 && (P.golsTemp||0)>=8){ P.stats.bolas = (P.stats.bolas||0)+1; log("Você ganhou a Bola de Ouro da temporada!", "conquista"); }
  P.golsTemp = 0;
  // renovação de contrato: a proposta depende do desempenho
  const ganhoBase = pos<=3 ? 0.3 : pos<=6 ? 0.15 : 0.05;
  P.eventoAtual = {
    id:"renovacao", titulo:"Renovação de contrato",
    texto:`O clube quer renovar seu contrato. Você terminou em ${pos}º lugar e o salário atual é R$ ${P.carreira.salario}/mês.`,
    opcoes:[
      {t:`Aceitar a proposta (+${Math.round(ganhoBase*100)}%)`, efeito:{}, fx:()=>{ P.carreira.salario = Math.round(P.carreira.salario*(1+ganhoBase)); }, log:"Você renovou o contrato."},
      {t:"Pedir um aumento maior", efeito:{estresse:+4}, sorte:{p:0.5,ganho:0,perda:0}, fx:()=>{ const sobe = Math.random()<0.5; P.carreira.salario = Math.round(P.carreira.salario*(sobe?1+ganhoBase*2:1)); }, log:"Você negociou com dureza."},
      {t:"Recusar e buscar outro clube", efeito:{reputacao:+2,felicidade:-3}, fx:()=>{ P.filaEventos=P.filaEventos||[]; P.filaEventos.push(gerarProposta()); }, log:"Você recusou e vai procurar outro clube."},
    ]
  };
  P.filaEventos = P.filaEventos || [];
  if(pos<=5 || P.mente.reputacao>=30) P.filaEventos.push(gerarProposta());
}

function avancarDia(){
  if(P.eventoAtual || jogoPendenteHoje() || P.partida) return;
  P.diaAbs++;
  P.dia++;
  if(P.lesao){
    P.lesao.dias--;
    if(P.lesao.dias<=0){ log(`Você se recuperou da lesão (${P.lesao.tipo}).`, "saude"); P.lesao=null; }
  }
  if(P.dia > 7){ P.dia = 1; fecharSemana(); }
  geraNoticiaDoDia();
  if(!P.eventoAtual && P.filaEventos && P.filaEventos.length){ P.eventoAtual = P.filaEventos.shift(); }
  if(P.dia !== DIA_JOGO && !P.eventoAtual && Math.random() < CHANCE_EVENTO_DIA){
    const ev = sortearEvento();
    if(ev){ P.eventoAtual = ev; P.cooldown[ev.id] = P.diaAbs; }
  }
  salvar(); render();
}

function telaCalendario(){

  const linhas = tab.map((t,i)=>`
    <tr class="${t.nome===P.carreira.clube?"me":""}">
      <td>${i+1}</td><td>${t.nome}</td><td>${t.j}</td><td>${t.v}</td><td>${t.e}</td><td>${t.d}</td>
      <td>${t.gp-t.gc}</td><td><b>${t.pts}</b></td>
    </tr>`).join("");

  const rodadas = P.calendario.map((jogos,i)=>{
    const meu = jogos.find(([a,b])=>a===P.carreira.clube||b===P.carreira.clube);
    if(!meu) return "";
    const adv = meu[0]===P.carreira.clube ? meu[1] : meu[0];
    const res = P.resultados?.[i+1];
    const atual = i+1===P.semana;
    return `<div class="row"><span>${atual?"<b>▶ ":""}Rodada ${i+1}${atual?"</b>":""}</span><span>${meu[0]===P.carreira.clube?"vs":"@"} ${adv}</span><span class="mut">${res || (i+1<P.semana?"–":"")}</span></div>`;
  }).join("");

  return `
    <div class="card">
      <h3>Tabela · temporada ${P.liga.temporada}</h3>
      <div style="overflow-x:auto">
      <table class="tbl">
        <tr><th>#</th><th>Clube</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th><th>Pts</th></tr>
        ${linhas}
      </table></div>
    </div>
    <div class="card"><h3>Seus jogos</h3>${rodadas}</div>`;
}

}

    forma:-2, estresse:+2, pGanho:0.65, pPerda:0.05, lesao:0.00, xpGanho:1 },

// Progresso necessário para subir um ponto. Cresce com o nível, então a evolução fica lenta.
const XP_NECESSARIO = lvl => Math.max(8, Math.round(8 + (lvl-30)*0.4));

function chaveSemana(){ return `${P.ano}-${P.semana}`; }
function jaTreinouNestaSemana(){ return P.ultimoTreino === chaveSemana(); }

// Chances estimadas para o jogador ver antes de decidir (sem revelar o sorteio).
function chancesTreino(focoId, metodoId){
  const foco = FOCOS.find(f=>f.id===focoId);
  const met = METODOS.find(m=>m.id===metodoId);
  if(!foco || !met || foco.attrs.length===0) return null;
  const attr = foco.attrs[0];
  const lvl = P.at[attr];
  const fForma = clamp((P.corpo.forma-10)/50, 0.5, 1.3);
  const dif = clamp(1 - (lvl-40)/80, 0.2, 1);
  const disc = 0.8 + P.mente.disciplina/250;
  const pG = clamp(met.pGanho * fForma * dif * disc, 0.02, 0.9);
  const pP = clamp(met.pPerda * (1 + P.mente.estresse/200), 0, 0.9);
  return { ganho: Math.round(pG*100), perda: Math.round(pP*100), lesao: Math.round(met.lesao*100) };
}

function subirOuDescerNivel(attr){
  let lvl = P.at[attr];
  P.xp[attr] = P.xp[attr] || 0;
  // Sobe de nível quando acumula progresso suficiente.
  while(P.xp[attr] >= XP_NECESSARIO(lvl) && lvl < 99){
    P.xp[attr] -= XP_NECESSARIO(lvl);
    lvl++;
    log(`${NOME_ATRIBUTO[attr]} subiu para ${lvl}.`, "evolucao");
  }
  // Perder progresso reduz o acumulado. Só cai de nível depois de um déficit grande,
  // e volta com a metade do progresso do nível novo, para não devolver tudo de uma vez.
  while(P.xp[attr] < -Math.floor(XP_NECESSARIO(lvl)/2) && lvl > 10){
    lvl--;
    P.xp[attr] = Math.floor(XP_NECESSARIO(lvl)/2);
    log(`${NOME_ATRIBUTO[attr]} caiu para ${lvl}.`, "evolucao");
  }
  P.at[attr] = lvl;
}

function executarTreino(focoId, metodoId){
  const foco = FOCOS.find(f=>f.id===focoId);
  const met = METODOS.find(m=>m.id===metodoId);
  if(jaTreinouNestaSemana()) return;

  aplicar({forma:met.forma, estresse:met.estresse});
  let msg;

  if(foco.attrs.length === 0){
    aplicar({estudo:2});
    if(Math.random()<0.5) aplicar({disciplina:1});
    msg = "Você estudou o jogo com calma. Pontos de estudo aumentaram.";
  } else {
    const attr = pick(foco.attrs);
    const ch = chancesTreino(focoId, metodoId);
    const u = Math.random();
    if(u < ch.ganho/100){
      P.xp[attr] = (P.xp[attr]||0) + met.xpGanho;
      msg = `Bom treino: progresso em ${NOME_ATRIBUTO[attr]}.`;
    } else if(u > 1 - ch.perda/100){
      P.xp[attr] = (P.xp[attr]||0) - 1;
      msg = `Treino ruim: você perdeu progresso em ${NOME_ATRIBUTO[attr]}.`;
    } else {
      msg = `Treino sem avanço claro em ${NOME_ATRIBUTO[attr]}.`;
    }
    subirOuDescerNivel(attr);
  }

  if(Math.random() < met.lesao){
    aplicar({saude:-8, forma:-6});
    msg += " Você sentiu uma lesão leve.";
  }

  P.ultimoTreino = chaveSemana();
  P.ultimoResultado = { foco: foco.nome, metodo: met.nome, msg };
  log(`Treino (${foco.nome}, ${met.nome}): ${msg}`, "treino");
}

// Com a idade, velocidade e resistência podem cair um pouco.
function declinioIdade(){
  if(P.idade < 34 || Math.random() > 0.012) return;
  const attr = pick(["velocidade","resistencia"]);
  P.at[attr] = clamp(P.at[attr]-1, 10, 99);
  log(`Com a idade, ${NOME_ATRIBUTO[attr]} caiu para ${P.at[attr]}.`, "evolucao");
}

function escolherMetodo(id){ TR.metodo = id; render(); }
function confirmarTreino(){
  if(!TR.foco || !TR.metodo || jaTreinouNestaSemana()) return;
  executarTreino(TR.foco, TR.metodo);
  TR = { foco:null, metodo:null };
  salvar(); render();
}

  const metodos = METODOS.map(m=>{

        const need = XP_NECESSARIO(v);

        return `<div class="stat"><span class="mut">${NOME_ATRIBUTO[k]}</span><b>${v}</b>

  {id:"celular", nome:"Celular topo de linha", cat:"Tecnologia", preco:5000, bonus:{felicidade:+3}},

  {id:"flores", nome:"Flores e chocolate", cat:"Relacionamento", preco:250, bonus:{felicidade:+2}, requerPar:true},
];
function comprar(tipo, id, forma){
  if(tipo==="consumo"){
    const it = CONSUMO.find(x=>x.id===id);
    if(!it || P.vida.dinheiro < it.preco) return;
    P.vida.dinheiro -= it.preco; aplicar(it.bonus);
    if(it.requerPar && P.par) P.par.afinidade = clamp(P.par.afinidade+6,0,100);
    log(`Comprou: ${it.nome}`, "compra"); salvar(); render(); return;
  }
  const lista = tipo==="veiculo" ? DADOS.veiculos : DADOS.casas;
  const item = lista.find(x=>x.id===id); if(!item) return;
  if(tipo==="veiculo" ? P.vida.veiculos.includes(id) : P.vida.casa===id) return;
  const parcelado = forma==="parcelado";
  const semanas = tipo==="casa" ? 104 : 52;
  const entrada = parcelado ? Math.round(item.preco*0.1) : item.preco;
  if(P.vida.dinheiro < entrada){ alert("Dinheiro insuficiente para a entrada."); return; }
  P.vida.dinheiro -= entrada;
  P.vida.dividas = P.vida.dividas || [];
  if(parcelado){
    const total = Math.round((item.preco-entrada)*1.25);
    P.vida.dividas.push({id, tipo, nome:item.nome, parcela:Math.ceil(total/semanas), restantes:semanas});
  }
  if(tipo==="veiculo") P.vida.veiculos.push(id); else P.vida.casa = id;
  aplicar(item.bonus);
  log(`${parcelado?"Financiou":"Comprou"}: ${item.nome}`, "compra");
  salvar(); render();
}
function investir(tipo, valor){
  if(P.vida.dinheiro < valor) return;
  P.vida.dinheiro -= valor;
  P.vida.investimentos[tipo] = (P.vida.investimentos[tipo]||0) + valor;
  log(`Aplicou R$ ${valor.toLocaleString("pt-BR")} em ${tipo==="rf"?"renda fixa":"ações"}.`, "compra");
  salvar(); render();
}
function resgatar(tipo){
  const v = Math.round(P.vida.investimentos[tipo]||0); if(!v) return;
  P.vida.dinheiro += v; P.vida.investimentos[tipo] = 0;
  log(`Resgatou R$ ${v.toLocaleString("pt-BR")} de ${tipo==="rf"?"renda fixa":"ações"}.`, "compra");
  salvar(); render();
}
function rendimentoSemanal(){
  const inv = P.vida.investimentos; if(!inv) return;
  inv.rf = Math.round((inv.rf||0)*1.006);
  if(inv.acoes>0){
    const variacao = Math.random()*0.20 - 0.08;
    inv.acoes = Math.max(0, Math.round(inv.acoes*(1+variacao)));
    if(variacao < -0.05) log("O mercado caiu e suas ações perderam valor.", "compra");
    else if(variacao > 0.08) log("Suas ações subiram bem essa semana.", "compra");
  }
}
function cobrarDividas(){
  for(const dv of P.vida.dividas||[]){ P.vida.dinheiro -= dv.parcela; dv.restantes--; }
  P.vida.dividas = (P.vida.dividas||[]).filter(dv=>dv.restantes>0);
  if(P.vida.dinheiro < 0){
    P.mente.estresse = clamp(P.mente.estresse+4,0,100);
    P.mente.felicidade = clamp(P.mente.felicidade-2,0,100);
    if(Math.random()<0.3) log("Você está no vermelho. As contas apertam.", "evento");
  }
}

    return `<div class="row"><span><b>${v.nome}</b><small class="mut" style="display:block">R$ ${v.preco.toLocaleString("pt-BR")} · manutenção R$ ${v.manut}/mês</small></span>
      <span class="btns">
        <button class="b" ${tem||dinheiro<v.preco?"disabled":""} onclick="comprar('veiculo','${v.id}','vista')">À vista</button>
        <button class="b" ${tem||dinheiro<entrada?"disabled":""} onclick="comprar('veiculo','${v.id}','parcelado')">Financiar 52 sem.<small>entrada R$ ${entrada.toLocaleString("pt-BR")}</small></button>
      </span></div>`;
  };
  const linhaCasa = c => {
    const tem = P.vida.casa===c.id;
    const entrada = Math.round(c.preco*0.1);
    return `<div class="row"><span><b>${c.nome}</b><small class="mut" style="display:block">R$ ${c.preco.toLocaleString("pt-BR")}</small></span>
      <span class="btns">
        <button class="b" ${tem||dinheiro<c.preco?"disabled":""} onclick="comprar('casa','${c.id}','vista')">À vista</button>
        <button class="b" ${tem||dinheiro<entrada?"disabled":""} onclick="comprar('casa','${c.id}','parcelado')">Financiar 104 sem.<small>entrada R$ ${entrada.toLocaleString("pt-BR")}</small></button>
      </span></div>`;
  };
  const cats = [...new Set(CONSUMO.map(c=>c.cat))];
  return `
    <section class="hero"><div class="hero-txt">
      <div class="sec-num">Compras</div>
      <h2>Seu dinheiro, suas escolhas</h2>
      <p class="mut">Saldo: <b>R$ ${dinheiro.toLocaleString("pt-BR")}</b> ${semanal?`· parcelas: R$ ${semanal.toLocaleString("pt-BR")}/semana`:""}</p>
    </div></section>
    <div class="card"><h3>01 · Veículos</h3>${DADOS.veiculos.map(linhaVeiculo).join("")}</div>
    <div class="card"><h3>02 · Moradia</h3>${DADOS.casas.map(linhaCasa).join("")}</div>
    ${cats.map(cat=>`
      <div class="card"><h3>${cat}</h3>
        <div class="btns">${CONSUMO.filter(c=>c.cat===cat).map(c=>{
          const sem = c.requerPar && !P.par;
          return `<button class="b" ${dinheiro<c.preco||sem?"disabled":""} onclick="comprar('consumo','${c.id}')">${c.nome}<small>R$ ${c.preco.toLocaleString("pt-BR")}${sem?" · precisa de alguém":""}</small></button>`;
        }).join("")}</div>
      </div>`).join("")}
    <div class="card"><h3>03 · Investimentos</h3>
      <div class="row"><span><b>Renda fixa</b><small class="mut" style="display:block">Rende cerca de 0,6% por semana</small></span><span><b>R$ ${Math.round(inv.rf||0).toLocaleString("pt-BR")}</b></span></div>
      <div class="btns" style="margin:8px 0 14px">
        <button class="b" ${dinheiro<5000?"disabled":""} onclick="investir('rf',5000)">Aplicar R$ 5.000<small>renda fixa</small></button>
        <button class="b" ${!inv.rf?"disabled":""} onclick="resgatar('rf')">Resgatar tudo</button>
      </div>
      <div class="row"><span><b>Ações</b><small class="mut" style="display:block">Pode subir ou cair muito a cada semana</small></span><span><b>R$ ${Math.round(inv.acoes||0).toLocaleString("pt-BR")}</b></span></div>
      <div class="btns" style="margin-top:8px">
        <button class="b" ${dinheiro<5000?"disabled":""} onclick="investir('acoes',5000)">Aplicar R$ 5.000<small>ações</small></button>
        <button class="b" ${!inv.acoes?"disabled":""} onclick="resgatar('acoes')">Resgatar tudo</button>
      </div>
    </div>
    <div class="card"><h3>04 · Dívidas</h3>
      ${dividas.length ? dividas.map(d=>`<div class="row"><span><b>${d.nome}</b><small class="mut" style="display:block">${d.restantes} semanas restantes</small></span><span class="mut">R$ ${d.parcela.toLocaleString("pt-BR")}/sem.</span></div>`).join("") : `<p class="mut">Nenhuma dívida no momento.</p>`}
    </div>`;
}

/* ===== Vida pessoal: relacionamento, família, hobbies e cabeça ===== */
const NOMES_PAR = ["Júlia","Camila","Rafaela","Lívia","Mariana","Bianca","Larissa","Carol"];
const HOBBIES = [
  {id:"musica", nome:"Tocar violão", desc:"Melhora o humor e o foco", frases:["Você passou a tarde tentando acertar um acorde novo.","Uma música antiga voltou e você tocou até tarde.","Você tocou para o pessoal da família e arrancou aplausos."]},
  {id:"leitura", nome:"Ler livros", desc:"Calma e visão de jogo", frases:["Um capítulo de biografia de atleta te deixou pensando.","Você leu até o sol nascer e dormiu cansado, mas feliz.","Um livro sobre estratégia te deu uma ideia para o treino."]},
  {id:"arte", nome:"Desenhar", desc:"Paciência e concentração", frases:["Você esboçou o rosto de um amigo sem olhar para o papel.","Um desenho novo ficou pronto, e você gostou do resultado.","Passou a noite pintando e esqueceu do celular."]},
  {id:"codigo", nome:"Programar", desc:"Lógica e disciplina", frases:["Você passou horas corrigindo um bug e finalmente funcionou.","Um projeto pequeno ficou pronto e você ficou orgulhoso.","Você aprendeu uma técnica nova lendo documentação."]},
  {id:"cozinha", nome:"Cozinhar", desc:"Alimentação e convivência", frases:["Você fez um prato novo e os amigos elogiaram.","Um almoço caseiro com a família virou festa.","A receita deu errado, mas a risada foi boa."]},
];
function nivelHobby(id){ return Math.min(5, Math.floor(((P.hobbies||{})[id]||0)/3)); }
function praticarHobby(id){
  if(P.diaAtividade === P.diaAbs) return;
  const h = HOBBIES.find(x=>x.id===id); if(!h) return;
  P.hobbies = P.hobbies || {};
  P.hobbies[id] = (P.hobbies[id]||0) + 1;
  aplicar({felicidade:+2, estresse:-2});
  P.diaAtividade = P.diaAbs;
  log(pick(h.frases), "pessoal");
  salvar(); render();
}
function acaoPessoal(id){
  if(P.pessoalSemana === chaveSemana()) return;
  const r = Math.random(); let msg = "";
  switch(id){
    case "conhecer":
      if(P.par) return;
      if(r < 0.6){ P.par = {nome:pick(NOMES_PAR), afinidade:30, status:"conhecendo"}; aplicar({felicidade:+3}); msg = `Você conheceu ${P.par.nome}. A conversa rendeu.`; }
      else msg = "Você saiu, mas ninguém te chamou a atenção.";
      break;
    case "encontro":
      if(!P.par) return;
      P.vida.dinheiro -= 200;
      P.par.afinidade = clamp(P.par.afinidade + 6 + (r<0.5?3:0), 0, 100);
      aplicar({felicidade:+3});
      msg = `Encontro com ${P.par.nome}: jantar e papo longo.`; break;
    case "presente":
      if(!P.par) return;
      P.vida.dinheiro -= 300; P.par.afinidade = clamp(P.par.afinidade+4,0,100);
      msg = `Você deu um presente para ${P.par.nome}.`; break;
    case "pedir":
      if(!P.par || P.par.status!=="conhecendo") return;
      if(P.par.afinidade >= 50){ P.par.status = "namoro"; aplicar({felicidade:+6}); msg = `Você pediu ${P.par.nome} em namoro, e ela aceitou.`; }
      else { P.par.afinidade = clamp(P.par.afinidade-8,0,100); msg = `${P.par.nome} quis esperar mais um pouco.`; }
      break;
    case "terminar":
      if(!P.par) return;
      msg = `Você terminou com ${P.par.nome}.`; aplicar({felicidade:-8,estresse:+6}); P.par = null; break;
    case "familia_ligar":
      aplicar({rel_familia:+2}); msg = "Você ligou para a família e conversou um bom tempo."; break;
    case "familia_visita":
      P.vida.dinheiro -= 300; aplicar({rel_familia:+5,felicidade:+3}); msg = "Você passou o fim de semana com a família."; break;
    case "psicologo":
      P.vida.dinheiro -= 250; aplicar({estresse:-10,felicidade:+3}); msg = "Você cuidou da cabeça numa sessão de terapia."; break;
    default: return;
  }
  P.pessoalSemana = chaveSemana();
  log(msg, "pessoal");
  salvar(); render();
}
function semanaPessoal(){
  if(P.par && P.par.status==="namoro"){
    P.par.afinidade = clamp(P.par.afinidade + (Math.random()<0.5?1:-2), 0, 100);
    aplicar({felicidade:+1});
    if(P.par.afinidade <= 15){ log(`Vocês se afastaram e terminaram com ${P.par.nome}.`, "pessoal"); aplicar({felicidade:-6}); P.par = null; }
  }
  for(const h of HOBBIES){ if(nivelHobby(h.id)>=3) P.mente.felicidade = clamp(P.mente.felicidade+1,0,100); }
}
function telaPessoal(){
  const ja = P.pessoalSemana === chaveSemana();
  const par = P.par;
  const btn = (id, nome, desc, ativo) => `<button class="b" ${ja||!ativo?"disabled":""} onclick="acaoPessoal('${id}')">${nome}<small>${desc}</small></button>`;
  return `
    <section class="hero"><div class="hero-txt">
      <div class="sec-num">Vida pessoal</div>
      <h2>Além do campo</h2>
      <p class="mut">Um compromisso pessoal por semana. Hobbies podem ser praticados todo dia.</p>
    </div></section>
    <div class="card"><h3>01 · Relacionamento</h3>
      ${par ? `<p><b>${par.nome}</b> · ${par.status==="namoro"?"namorando":"conhecendo"}</p>${statBox("Afinidade", par.afinidade)}` : `<p class="mut">Você está solteiro.</p>`}
      <div class="btns" style="margin-top:12px">
        ${btn("conhecer","Conhecer alguém","Chance de conhecer uma pessoa nova",!par)}
        ${btn("encontro","Sair para um encontro","R$ 200 · afinidade sobe",!!par)}
        ${btn("presente","Dar um presente","R$ 300 · afinidade +4",!!par)}
        ${btn("pedir","Pedir em namoro","Precisa de afinidade 50+",!!par && par.status==="conhecendo")}
        ${btn("terminar","Terminar","Dói, mas acontece",!!par)}
      </div></div>
    <div class="card"><h3>02 · Família e cabeça</h3>
      <div class="btns">
        ${btn("familia_ligar","Ligar para a família","Sem custo · relação +2",true)}
        ${btn("familia_visita","Visitar a família","R$ 300 · relação +5, felicidade +3",true)}
        ${btn("psicologo","Sessão de psicólogo","R$ 250 · estresse −10",true)}
      </div></div>
    <div class="card"><h3>03 · Hobbies</h3>
      ${HOBBIES.map(h=>`<div class="row"><span><b>${h.nome}</b><small class="mut" style="display:block">${h.desc}</small></span>
        <span><button class="b" ${P.diaAtividade===P.diaAbs?"disabled":""} onclick="praticarHobby('${h.id}')">Praticar<small>nível ${nivelHobby(h.id)}</small></button></span></div>`).join("")}
    </div>`;
}

/* ===== The Fenômeno: nota OVR, níveis, ranking e modo rápido ===== */
function ovr(){
  const at = Object.values(P.at);
  const media = at.reduce((a,b)=>a+b,0)/at.length;
  const bonus = (P.mente.reputacao-10)*0.12 + (P.corpo.forma-50)*0.05 + Math.min(P.stats.gols,200)*0.02 + (P.carreira.titulos||0)*0.8 + (P.stats.bolas||0)*1.5;
  return clamp(Math.round(media*1.15 + bonus), 1, 99);
}
function tierOVR(o){
  if(o>=95) return "O Fenômeno · praticamente impossível";
  if(o>=87) return "Top 10 de todos os tempos";
  if(o>=75) return "Craque · destaque nacional";
  if(o>=62) return "Jogador comum · titular";
  return "Novato · em formação";
}
function tierCurto(o){
  if(o>=95) return "O Fenômeno";
  if(o>=87) return "Top 10";
  if(o>=75) return "Craque";
  if(o>=62) return "Titular";
  return "Novato";
}
function posCod(p){
  p = p || "";
  if(/Goleiro/.test(p)) return "GOL";
  if(/Zagueiro|Lateral/.test(p)) return "ZAG";
  if(/Volante|Meia/.test(p)) return "MEI";
  return "ATA";
}
function fcardHTML(){
  return `<div class="fcard">
    <div class="fc-top"><b class="fc-ovr">${ovr()}</b><span class="fc-pos">${posCod(P.perfil.posicao)}</span></div>
    <div class="fc-av">${avatarHTML(P)}</div>
    <div class="fc-name">${P.perfil.nome}</div>
    <div class="fc-tier">${tierCurto(ovr())}</div>
    <div class="fc-stats">
      <span><b>${P.stats.gols}</b>GOLS</span><span><b>${P.stats.assist}</b>ASSIST</span>
      <span><b>${P.carreira.titulos}</b>TÍTULOS</span><span><b>${P.stats.bolas||0}</b>BOLAS</span>
    </div></div>`;
}
const LENDAS = [
  {nome:"O Relâmpago", pos:"ATA", ovr:97, gols:742, titulos:24, bolas:8},
  {nome:"Maestro Dourado", pos:"MEI", ovr:96, gols:310, titulos:31, bolas:7},
  {nome:"A Muralha", pos:"ZAG", ovr:95, gols:41, titulos:27, bolas:2},
  {nome:"Cometa Sul-Americano", pos:"ATA", ovr:95, gols:688, titulos:19, bolas:6},
  {nome:"Príncipe da Área", pos:"ATA", ovr:94, gols:603, titulos:17, bolas:5},
  {nome:"Mago do Meio", pos:"MEI", ovr:93, gols:244, titulos:22, bolas:4},
  {nome:"Guardião Eterno", pos:"GOL", ovr:92, gols:0, titulos:20, bolas:1},
  {nome:"Furacão da Ponta", pos:"ATA", ovr:91, gols:512, titulos:12, bolas:3},
  {nome:"Capitão Silencioso", pos:"ZAG", ovr:90, gols:58, titulos:18, bolas:1},
  {nome:"Dono da Camisa 10", pos:"MEI", ovr:89, gols:275, titulos:14, bolas:2},
  {nome:"Lenda da Base", pos:"ATA", ovr:88, gols:380, titulos:9, bolas:1},
  {nome:"Goleiro de Aço", pos:"GOL", ovr:87, gols:0, titulos:11, bolas:0},
];
function telaRanking(){
  const f = P.rankFiltro || "Geral";
  const filtros = ["Geral","GOL","ZAG","MEI","ATA"];
  const nomes = {GOL:"Goleiros",ZAG:"Defensores",MEI:"Meio-campistas",ATA:"Atacantes",Geral:"Geral"};
  const eu = {nome:P.perfil.nome, pos:posCod(P.perfil.posicao), ovr:ovr(), gols:P.stats.gols, titulos:P.carreira.titulos, bolas:P.stats.bolas||0, euMesmo:true};
  const lista = [...LENDAS, eu]
    .filter(x => f==="Geral" || x.pos===f)
    .sort((a,b)=> b.ovr-a.ovr || b.gols-a.gols)
    .slice(0,10);
  const linhas = lista.map((x,i)=>`
    <tr class="${x.euMesmo?"rk-me":""}">
      <td>${i+1}</td>
      <td>${x.nome}<div class="rk-tier">${tierCurto(x.ovr)}</div></td>
      <td>${x.pos}</td><td><b>${x.ovr}</b></td><td>${x.gols}</td><td>${x.titulos}</td><td>${x.bolas}</td>
    </tr>`).join("");
  return `
    <section class="hero">
      <div class="hero-txt">
        <div class="sec-num">01 · Ranking global</div>
        <h2>Top 10 de todos os tempos</h2>
        <p class="mut">Compare sua nota OVR com as maiores carreiras. Os nomes das lendas são fictícios.</p>
      </div>
    </section>
    <div class="pills">${filtros.map(k=>`<span class="pill ${f===k?"on":""}" onclick="setRanking('${k}')">${nomes[k]}</span>`).join("")}</div>
    <div class="card" style="overflow-x:auto">
      <table class="tbl">
        <tr><th>#</th><th>Jogador</th><th>Pos</th><th>OVR</th><th>Gols</th><th>Títulos</th><th>Bolas</th></tr>
        ${linhas}
      </table>
    </div>`;
}
function setRanking(k){ P.rankFiltro = k; salvar(); render(); }
function setModo(m){ P.modo = m; salvar(); render(); }
function setNivel(n){ P.nivel = n; salvar(); render(); }
function entrarEmCampo(){
  if(P.modo === "rapido") jogarRapido(); else iniciarPartida();
}
// Modo rápido: a partida acontece sem clicar em cada lance, com tática equilibrada e as melhores escolhas.
function jogarRapido(){
  iniciarPartida();
  const pt = P.partida; if(!pt) return;
  pt.tatica = "equilibrada"; pt.instrucao = "equipe";
  comecarJogo();
  // Escolha automática: evita segurar a bola e prefere ataques que podem virar gol.
  const VALOR_ACAO = {chute:1.6, cabeca:1.4, drible:1.1, passe:0.85, fim_ataque:1.2, fim_defesa:0.9, marca:1, recua:0.9, pressao:0.9, reclama:0.8};
  const pontuacao = o => o.acao==='segura' ? -1 : o.base*(VALOR_ACAO[o.acao]??1) + ((P.at[o.attr]??50)-50)/100 - (o.risco?0.05:0);
  let guarda = 0;
  while(P.partida && guarda++ < 60){
    const atual = P.partida;
    if(atual.fase === "intervalo"){ resolverPalestra(0); continue; }
    if(atual.fase !== "jogo") break;
    const lance = atual.lancesDoJogo[atual.lance];
    let melhor = 0;
    lance.opcoes.forEach((o,i)=>{ if(pontuacao(o) > pontuacao(lance.opcoes[melhor])) melhor = i; });
    resolverLance(melhor);
  }
}

/* ---------- Inicialização ---------- */
P = carregar();
if(P){
  P.xp = P.xp || Object.fromEntries(Object.keys(P.at).map(k=>[k,0]));
  P.rel = P.rel || {}; if(P.rel.treinador==null) P.rel.treinador = 50;
  P.noticias = P.noticias || []; P.lesao = P.lesao || null;
  P.cartoes = P.cartoes || 0; P.suspenso = !!P.suspenso;
  P.resultados = P.resultados || {};
  P.filaEventos = P.filaEventos || [];
  P.vida.dividas = P.vida.dividas || []; P.vida.investimentos = P.vida.investimentos || {rf:0,acoes:0}; P.hobbies = P.hobbies || {}; P.pessoalSemana = P.pessoalSemana || null;
  P.modo = P.modo || "completo"; P.nivel = P.nivel || "amador"; P.stats.bolas = P.stats.bolas || 0; P.golsTemp = P.golsTemp || 0;
}
render();
</script>
